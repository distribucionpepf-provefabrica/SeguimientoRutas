  const c={};ESTADOS.forEach(e=>c[e]=0);base.forEach(f=>c[f.est]++);
  const n=base.length,hechas=base.filter(f=>FINAL[f.est]).length,pct=n?Math.round(hechas/n*100):0;
  const sel=(id,lab,val,ops,todos)=>`<div class="campo"><label class="sr" for="${id}">${lab}</label><select class="sel${val?' activo':''}" id="${id}"><option value="">${todos}</option>${ops.map(o=>`<option value="${esc(o[0])}"${o[0]===val?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;

  let h=`<header class="top"><div class="top-in">
      <img class="top-logo" src="${LOGO}" alt="Provefabrica">
      <div class="top-tit"><h1>Seguimiento de Pedidos — Despacho y Distribución</h1><p>Provefabrica del Perú S.A. · Almacén Huachipa, Lima Este</p></div>
      <span class="top-esp"></span>
      ${enInd?'':`<div class="fecha"><button class="fl" id="diaAnt" aria-label="Día anterior">‹</button>
        <button class="fecha-b" id="diaBtn" aria-haspopup="dialog" aria-expanded="${calAbierto}" aria-label="${esc(fechaCorta(dia))}. Elegir otra fecha en el calendario"><b>${esc(fechaCorta(dia))}</b><small>${IC_CAL}${esc(relDia(dia)==='Elegir otra fecha'?'Cambiar fecha':relDia(dia))}</small></button>
        <button class="fl" id="diaSig" aria-label="Día siguiente">›</button>${dia!==hoyLima()?'<button class="hoy" id="diaHoy">Hoy</button>':''}</div>`}
      <div class="usuario"><div class="quien"><b>${esc(ses.usuario)}</b><small>CONSULTA</small></div><button class="btn-claro" id="salir">Salir</button></div>
    </div></header>
    <nav class="tabs" role="tablist">
      <button class="tab${vista==='tablero'?' on':''}" data-vista="tablero" role="tab">1 · Tablero del día <span class="cnt">${hechas}/${n}</span></button>
      <button class="tab${vista==='pedido'?' on':''}" data-vista="pedido" role="tab">2 · Por pedido <span class="cnt">${visibles.length}</span></button>
      <button class="tab${vista==='camion'?' on':''}" data-vista="camion" role="tab">3 · Por camión <span class="cnt">${(hayFiltro()?cams.filter(x=>x.filas.some(coincide)):cams).length}</span></button>
      ${verIndicadores()?`<button class="tab${enInd?' on':''}" data-vista="indic" role="tab">4 · Indicadores</button>`:''}
    </nav>`;
  if(enInd){app.innerHTML=h+vistaIndicadores();enlazar();indEnlazar();pintarVivo();ubicarCal();const tb=app.querySelector('.tab.on');if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'nearest'});return;}
  if(todas.length){
    const camsBase=cams.filter(x=>x.filas.some(coincideBase));
    const cEn=camsBase.filter(x=>!x.listo&&(x.hechas||x.ahora)).length,cFin=camsBase.filter(x=>x.listo).length,cSin=camsBase.filter(x=>!x.listo&&!x.hechas&&!x.ahora).length;
    const porTurno=turnos.length>1?turnos.map(t=>{const fs=base.filter(f=>String(f.prog.turno)===t);const h2=fs.filter(f=>FINAL[f.est]).length;
      return `<div class="rt t${t==='2'?2:1}"><span class="turno-chip">${turnoTxt(t)}</span><span class="mini-barra">${ESTADOS.map(e=>{const k=fs.filter(f=>f.est===e).length;return k?`<i class="${cls(e)}" style="flex:${k}"></i>`:'';}).join('')}</span><b>${h2}</b>/${fs.length}</div>`;}).join(''):'';
    const filtroTxt=[F.tipo?(TIPOS_PED.find(t=>t[0]===F.tipo)||[])[1]:''].concat(F.asesor?nombreAsesor(F.asesor):F.placa?F.placa:F.zona?'Zona '+tit(F.zona):F.q?'Búsqueda: '+F.q:'').filter(Boolean).join(' · ');
    h+=`<section class="resumen" aria-label="Resumen del día"><div class="res-in">
      <div class="res-av"><div class="anillo" style="--p:${pct}" role="img" aria-label="${pct}% atendido"><b>${pct}%</b></div>
        <div class="tx"><b>${hechas} de ${n}</b><span>facturas atendidas</span>${filtroTxt?`<small>${esc(filtroTxt)}</small>`:''}</div></div>
      <div class="res-centro"><div class="res-barra" aria-hidden="true">${ESTADOS.filter(e=>c[e]).map(e=>`<i class="${cls(e)}" style="flex:${c[e]}" title="${STAT[e]}: ${c[e]}"></i>`).join('')}</div>
        <div class="res-estados" role="group" aria-label="Filtrar por estado">${ESTADOS.map(e=>`<button class="est-btn ${cls(e)}${F.est===e?' on':''}${c[e]?'':' cero'}" data-est="${e}" aria-pressed="${F.est===e}" title="${STAT[e]}: ${AYUDA[e]}"><i></i><b>${c[e]}</b>${STAT[e]}</button>`).join('')}</div></div>
      <div class="res-cam">
        <div class="fila"><i style="background:var(--proc-f)"></i><b>${cEn}</b>${cEn===1?'camión en ruta':'camiones en ruta'}</div>
        <div class="fila"><i style="background:var(--term-f)"></i><b>${cFin}</b>${cFin===1?'terminó su ruta':'terminaron su ruta'}</div>
        <div class="fila"><i style="background:#c7cdd4"></i><b>${cSin}</b>${cSin===1?'sin atender aún':'sin atender aún'}</div>
        ${porTurno?'<hr>'+porTurno:''}
      </div><div class="res-vitrina" role="img" aria-label="Productos Provefabrica del catálogo 2024">${vitrinaHtml()}</div></div></section>`;
  }
  h+=`<div class="toolbar"><div class="toolbar-in">
      <div class="buscar">${IC.lupa}<input id="q" type="search" placeholder="Buscar cliente, factura, distrito o placa" value="${esc(F.q)}" autocomplete="off">${F.q?'<button class="x" id="qX" aria-label="Borrar búsqueda">×</button>':''}</div>
      ${todas.length?(()=>{const bt=todas.filter(f=>coincideBase(f,true)),k=t=>bt.filter(f=>tipoPed(f.p)===t).length;
        return `<div class="tipo-seg" role="group" aria-label="Filtrar por tipo de pedido"><button type="button" data-tipo="" class="${F.tipo?'':'on'}" aria-pressed="${!F.tipo}">Todos <b>${bt.length}</b></button>${TIPOS_PED.map(([c,t])=>{const n=k(c);return `<button type="button" data-tipo="${c}" class="t-${c.toLowerCase()}${F.tipo===c?' on':''}${n?'':' cero'}" aria-pressed="${F.tipo===c}"${n||F.tipo===c?'':' disabled'}><i></i>${t} <b>${n}</b></button>`;}).join('')}</div>`;})():''}
      ${ASE.personas.length||ASE.envios.length?`<div class="campo"><label class="sr" for="ase">Asesor o tipo de envío</label><select class="sel${F.asesor?' activo':''}" id="ase"><option value="">Asesor: todos</option>${ASE.personas.length?`<optgroup label="Asesores">${ASE.personas.map(g=>`<option value="${esc(g.key)}"${g.key===F.asesor?' selected':''}>${esc(g.txt)}</option>`).join('')}</optgroup>`:''}${ASE.envios.length?`<optgroup label="Tipo de envío">${ASE.envios.map(g=>`<option value="${esc(g.key)}"${g.key===F.asesor?' selected':''}>${esc(g.txt)}</option>`).join('')}</optgroup>`:''}</select></div>`:''}
      ${placas.length>1?sel('pla','Placa',F.placa,placas.map(p=>[p,p]),'Placa: todas'):''}
      ${zonas.length>1?sel('zon','Zona',F.zona,zonas,'Zona: todas'):''}
      ${turnos.length>1?sel('tur','Turno',turno==='todos'?'':turno,turnos.map(t=>[t,t==='2'?'2do turno':'1er turno']),'Turno: todo el día'):''}
      ${hayFiltro()?'<button class="quitar" id="quitar">Quitar filtros</button>':''}
      <span class="tool-esp"></span>
      <span class="vivo" id="vivo"></span>
      <button class="btn-ico${cargando?' girando':''}" id="actualizar" title="Actualizar ahora" aria-label="Actualizar ahora">${IC.recargar}</button>
    </div></div>`;

  h+='<main>';
  if(error)h+=`<div class="aviso err">${datos?'No se pudo actualizar ('+esc(error)+'). Se muestra lo último que llegó'+(ultCarga?' a las '+horaLima(ultCarga):'')+'.':'No se pudo consultar el despacho: '+esc(error)+'. Revisa tu conexión.'}</div>`;
  if(datos&&todas.length&&F.asesor&&!base.length&&!F.q&&!F.placa&&!F.zona)h+=`<div class="aviso">${esc(nombreAsesor(F.asesor))} no tiene pedidos en este despacho.</div>`;
  if(!datos&&cargando)h+='<div class="vacio"><b>Consultando el despacho…</b>Un momento.</div>';
  else if(!datos)h+='<div class="vacio"><b>No se pudo cargar el despacho</b>Revisa tu conexión e inténtalo otra vez.<br><button id="reint">Reintentar</button></div>';
  else if(!todas.length)h+=`<div class="vacio"><b>No hay despacho guardado para el ${esc(fechaCorta(dia).toLowerCase())}</b>Aparecerá aquí en cuanto el supervisor guarde la programación del día.${dia!==hoyLima()?'<br><button id="vHoy">Ver hoy</button>':''}</div>`;
  else if(hayFiltro()&&!visibles.length)h+='<div class="vacio"><b>Nada coincide con los filtros</b>Prueba con otra palabra o quita los filtros.<br><button id="vQuitar">Quitar filtros</button></div>';
  else h+=vista==='pedido'?vistaPedidos(cams):vista==='camion'?vistaCamiones(cams,turnos):vistaTablero(cams,turnos);
  h+=`</main><footer class="firma">${FIRMA}</footer>`;

  const foco=document.activeElement&&document.activeElement.id==='q'?$('q').selectionStart:null;
  app.innerHTML=h;
  if(foco!=null){const q=$('q');q.focus();try{q.setSelectionRange(foco,foco);}catch(e){}}
  enlazar();pintarVivo();ubicarCal();
}

function nombreAsesor(k){const g=[...ASE.personas,...ASE.envios].find(g=>g.key===k);return g?g.txt:(k.startsWith('P:')?tit(k.slice(2)):'');}
const leyendaTurnos=()=>{const ts=[...new Set(((datos&&datos.programaciones)||[]).map(p=>String(p.turno)))].sort();return ts.length>1?ts.map(t=>`<span class="lt t${t==='2'?2:1}"><i></i>${turnoTxt(t)}</span>`).join(''):'';};
const leyenda=()=>`<div class="leyenda">${ESTADOS.map(e=>`<span class="${cls(e)}" title="${AYUDA[e]}"><i></i>${TXT[e]}</span>`).join('')}<span class="sig"><i></i>Próxima parada</span>${leyendaTurnos()}</div>`;

/* ----- 1 · tablero ----- */
function lineaCamion(cam){
  if(cam.listo)return `<b class="c-TERMINADO">✓ Ruta terminada</b>${cam.fin?' a las '+hm(cam.fin):''}`;
  if(cam.ahora)return `<b class="c-EN_PROCESO">● En el cliente:</b> ${esc(corto(cam.ahora.cli))}`;
  if(!cam.hechas)return `<b class="c-EN_RUTA">Aún sin atender</b>`;
  return `<b class="c-EN_RUTA">→ Va hacia:</b> ${esc(corto(cam.sig?cam.sig.cli:''))}`;
}
function vistaTablero(cams,turnos){
  const lista=(hayFiltro()?cams.filter(x=>x.filas.some(coincide)):cams).slice().sort(ordenCamion);
  const N=Math.max(...lista.map(x=>x.paradas.length),1);
  const grupos=turno==='todos'&&turnos.length>1?turnos.map(t=>({t,cs:lista.filter(x=>String(x.prog.turno)===t)})).filter(g=>g.cs.length):[{t:null,cs:lista}];
  let filas='<div class="tb-col">Camión</div>'+Array.from({length:N},(_,i)=>`<div class="tb-col">${i+1}°</div>`).join('');
  grupos.forEach(g=>{
    if(g.t)filas+=`<div class="tb-turno t${g.t==='2'?2:1}"><span class="turno-chip">${turnoTxt(g.t)}</span><small>${plural(g.cs.length,'camión','camiones')}</small></div>`;
    g.cs.forEach(cam=>{
      const pct=Math.round(cam.hechas/cam.paradas.length*100);
      const tt=turnoDe(cam);
      filas+=`<div class="tb-cab ${tt}${cam.ahora?' atiende':''}${cam.listo?' listo':''}">
        <div class="tb-c1"><span class="letra">${esc(cam.u.ruta||'·')}</span><div><b>${esc(cam.u.placa)}${ubiChip(cam)}</b><small${telTitulo(cam.u)}>${esc(tit(cam.u.personal||''))}</small></div></div>
        <div class="tb-av"><b>${pct}%</b>${cam.hechas}/${cam.paradas.length}<span class="mini-barra">${cam.paradas.map(s=>`<i class="${cls(s.est)}"></i>`).join('')}</span></div>
        <div class="tb-linea">${lineaCamion(cam)}</div></div>`;
      /* v28 · «carretera»: cada parada es una estación sobre la vía del camión (número + tramo pintado con su estado)
         y debajo su tarjeta: hora e íconos, cliente en dos líneas, distrito y cantidad de facturas. */
      cam.paradas.forEach((s,iP)=>{
        const vis=!hayFiltro()||s.filas.some(coincide);
        const hora=s.fin?hm(s.fin):s.llegada?hm(s.llegada):'';
        const ult=iP===cam.paradas.length-1;
        filas+=`<button class="tile ${tt} ${cls(s.est)}${cam.sig===s&&!cam.ahora?' sig':''}${vis?'':' apagado'}${s.inc.length?' con-inc':''}${iP===0?' pri':''}${ult?' ult':''}${ult&&cam.listo?' meta':''}" data-par="${esc(cam.id)}|${s.pos}" title="${esc(tit(s.cli))}: ${TXT[s.est]}">
          <span class="t1"><span class="n">${s.pos}</span></span>
          <span class="cuerpo"><span class="c-top">${hora?`<span class="h">${hora}</span>`:''}<span class="c-ic">${s.inc.length?`<span class="inc-m" title="${s.inc.length} novedad(es): ${esc(s.inc.map(i=>novTxt(i.tipo)).join(', '))}">${IC_NOV}${s.inc.length>1?s.inc.length:''}</span>`:''}${s.filas.some(f=>fotosDe(f).length)?`<span class="foto-m" title="Tiene foto de la guía firmada">${IC_FOTO}</span>`:''}</span></span>
          <span class="cl">${esc(tit(corto(s.cli)))}</span>
          <span class="pie"><span class="d"><i style="background:${zColor(s.zona)}"></i>${esc(tit(s.distrito))}</span>${s.filas.length>1?`<span class="k">${s.filas.length} fact.</span>`:''}</span></span></button>`;
      });
      for(let i=cam.paradas.length;i<N;i++)filas+='<span></span>';
    });
  });
  return `<section class="panel"><div class="panel-h">${IC.rejilla}Avance del despacho<span class="der">Cada fila es un camión · las columnas siguen el orden de visita</span></div>
    ${leyenda()}<div class="tablero"><div class="tb" style="--n:${N}">${filas}</div></div></section>`;
}

/* ----- 2 · por pedido ----- */
function notaPedido(f){
  const s=f.parada,e=f.e||{};
  if(f.est==='EN PROCESO')return `<b>El camión está en el cliente</b>${e.horaLlegada?' desde las '+hm(e.horaLlegada):''}.`;
  if(f.est==='TERMINADO')return `<b>Entregado</b>${e.horaFin?' a las '+hm(e.horaFin):''}.`;
  if(f.est==='ENTREGA PARCIAL')return `<b>Entrega parcial</b>${e.horaFin?' a las '+hm(e.horaFin):''}.${e.detalle?' '+esc(e.detalle):''}`;
  if(f.est==='ANULADO')return `<b>Anulado.</b> ${e.motivo?'Motivo: '+esc(e.motivo):''}`;
  if(s.est==='EN PROCESO')return '<b>El camión ya está en este cliente</b> entregando otra factura.';
  const a=antesDe(f);
  if(a===0)return '<b>Es la próxima parada del camión.</b>';
  if(f.cam.ahora&&a===1)return '<b>Es la siguiente parada</b> después del cliente que está atendiendo.';
  return a===1?'<b>Falta 1 parada</b> antes de este cliente.':`<b>Faltan ${a} paradas</b> antes de este cliente.`;
}
function fotoTag(f){const n=fotosDe(f).length;
  return n?`<span class="foto-t">${IC_FOTO}Guía firmada${n>1?' · '+n+' fotos':''}</span>`:NECESITA_FOTO[f.est]?`<span class="foto-t falta">${IC_FOTO}Foto de la guía por llegar</span>`:'';}
function zonaHtml(z){const c=zColor(z);return z?`<span class="zona" style="background:${c}1c;color:${c}">${esc(String(z).toUpperCase())}</span>`:'';}
function horaFila(f){const e=f.e||{};
  if(e.horaFin&&FINAL[f.est])return `${hm(e.horaFin)}<small>terminó</small>`;
  if(e.horaLlegada)return `${hm(e.horaLlegada)}<small>llegó</small>`;
  return '<span style="color:#b4bcc5">—</span>';}
const cerrados=new Set(leer('seg_cerrados',[]));
function ordenCamion(a,b){return String(a.prog.turno).localeCompare(String(b.prog.turno))||String(a.u.ruta||'').localeCompare(String(b.u.ruta||''))||String(a.u.placa).localeCompare(String(b.u.placa));}
function segmento(cam,fs){
  const tt=turnoDe(cam),id=cam.id,cerrado=cerrados.has(id)&&!hayFiltro();
  const nov=cam.filas.filter(f=>f.est==='ANULADO'||f.est==='ENTREGA PARCIAL').length;
  const proxima=!cam.ahora&&cam.sig?cam.sig:null;
  let ant=null;
  const filas=fs.map(f=>{
    const misma=ant&&ant.parada===f.parada;ant=f;
    return `<tr class="fila ${cls(f.est)}${proxima&&f.parada===proxima?' sig':''}${misma?' misma':''}" data-fila="${esc(f.id)}" tabindex="0">
      <td class="td-n"><span class="nn ${cls(f.parada.est)}">${f.parada.pos}</span></td>
      <td class="td-cli"><b>${esc(corto(f.p.CLIENTES))}</b><small>Factura ${esc(f.p.FACTURA||'sin número')}</small>${f.inc.length?`<span class="inc-t">${IC_NOV}${esc(f.inc.map(i=>novTxt(i.tipo)).join(' · '))}</span>`:''}${fotoTag(f)}</td>
      <td class="td-seg ${cls(f.est)}"><span class="est ${cls(f.est)}">${TXT[f.est]}</span><span class="sg">${notaPedido(f)}</span></td>
      <td>${zonaHtml(f.p.ZONA)}<span class="dist">${esc(tit(f.p.DISTRITO))}</span></td>
      <td>${asesorHtml(f.p,true)}</td>
      <td class="td-h">${horaFila(f)}</td></tr>`;}).join('');
  const tarjetas=fs.map(f=>`<button class="ped ${cls(f.est)}" data-fila="${esc(f.id)}">
      <div class="ped-cab"><span class="nn-m ${cls(f.parada.est)}">${f.parada.pos}</span><span class="ped-cli">${esc(corto(f.p.CLIENTES))}</span><span class="est ${cls(f.est)}">${TXT[f.est]}</span></div>
      <div class="ped-datos"><span>Factura <b>${esc(f.p.FACTURA||'sin número')}</b></span><span>${esc(tit(f.p.DISTRITO))}</span>${F.asesor?'':asesorHtml(f.p,false)}</div>
      <div class="ped-nota">${notaPedido(f)}</div>${f.inc.length?`<span class="inc-t">${IC_NOV}${esc(f.inc.map(i=>novTxt(i.tipo)).join(' · '))}</span>`:''}${fotoTag(f)}</button>`).join('');
  return `<section class="seg ${tt}${cerrado?' cerrado':''}">
    <button class="seg-h" data-seg="${esc(id)}" aria-expanded="${!cerrado}">
      <span class="flecha-seg" aria-hidden="true">▾</span><span class="letra">${esc(cam.u.ruta||'·')}</span><span class="placa">${esc(cam.u.placa)}</span>
      <span class="seg-tx"><b>Ruta ${esc(cam.u.ruta||'—')}${ubiChip(cam)}</b><small${telTitulo(cam.u)}>${esc(tit(cam.u.personal||''))}</small></span>
      <span class="turno-chip">${turnoTxt(cam.prog.turno)}</span>
      ${nov?`<span class="seg-nov">${plural(nov,'novedad','novedades')}</span>`:''}
      <span class="seg-ahora">${lineaCamion(cam)}</span>
      <span class="seg-av"><span class="mini-barra">${cam.paradas.map(x=>`<i class="${cls(x.est)}"></i>`).join('')}</span><span><b>${cam.hechas}</b>/${cam.paradas.length} paradas${hayFiltro()?` · ${fs.length} coinciden`:''}</span></span>
    </button>
    <div class="seg-cuerpo">
      <table class="tabla"><colgroup><col class="c-n"><col class="c-cli"><col><col class="c-zon"><col class="c-ase"><col class="c-h"></colgroup>
        <thead><tr><th>N°</th><th>Cliente</th><th>Estado y seguimiento</th><th>Zona / distrito</th><th>Asesor / envío</th><th>Hora</th></tr></thead><tbody>${filas}</tbody></table>
      <div class="peds">${tarjetas}</div></div></section>`;
}
function vistaPedidos(cams){
  const segs=cams.slice().sort(ordenCamion).map(cam=>({cam,fs:cam.paradas.flatMap(s=>s.filas).filter(coincide)})).filter(x=>x.fs.length);
  const total=segs.reduce((a,x)=>a+x.fs.length,0);
  return `<section class="panel"><div class="panel-h">${IC.lista}Pedidos del día por camión<span class="der">${plural(total,'factura')} en ${plural(segs.length,'camión','camiones')}${hayFiltro()?' con los filtros':''}</span></div>
    ${leyenda()}<div class="segs">${segs.map(x=>segmento(x.cam,x.fs)).join('')}</div></section>`;
}

/* ----- 3 · por camión ----- */
function via(cam,marca){
  const pts=cam.paradas.map(s=>{
    const vis=!hayFiltro()||s.filas.some(coincide);
    return `<button class="pto ${cls(s.est)}${vis?'':' apagado'}${marca&&s===marca?' marcado':''}" data-par="${esc(cam.id)}|${s.pos}" title="${s.pos}. ${esc(corto(s.cli))}: ${TXT[s.est]}" aria-label="Parada ${s.pos}, ${esc(corto(s.cli))}, ${TXT[s.est]}">${s.pos}</button>`;
  }).join('');
  return `<div class="via-caja"><div class="via" style="--n:${cam.paradas.length}"><span class="salida" title="Almacén">${IC.almacen}</span>${pts}
    <span class="camion${cam.listo?' fin':''}" style="--k:${cam.k}" title="${cam.listo?'Ruta terminada':'Posición del camión'}">${IC.camion}</span></div></div>`;
}
function fraseCamion(cam){
  if(cam.listo)return `<b class="c-TERMINADO">Ruta terminada</b>${cam.fin?' a las '+hm(cam.fin):''}.`;
  if(cam.ahora)return `<b class="c-EN_PROCESO">En el cliente:</b> ${esc(corto(cam.ahora.cli))}, parada ${cam.ahora.pos}${cam.ahora.llegada?', desde las '+hm(cam.ahora.llegada):''}.`;
  if(!cam.hechas)return `<b class="c-EN_RUTA">Aún sin atender.</b> Primera parada: ${esc(corto(cam.sig?cam.sig.cli:cam.paradas[0].cli))}.`;
  return `<b class="c-EN_RUTA">Va hacia:</b> ${esc(corto(cam.sig.cli))}, parada ${cam.sig.pos}.`;
}
function filaParada(cam,s){
  const facs=s.filas.map(f=>`<span class="fac ${cls(f.est)}" title="${TXT[f.est]}"><i></i>${esc(f.p.FACTURA||'Sin factura')}</span>`).join('');
  const hora=s.llegada?(hm(s.llegada)+(s.fin?' – '+hm(s.fin):'')):'';
  return `<li><button class="fila-p ${cls(s.est)}" data-par="${esc(cam.id)}|${s.pos}"><span class="nn">${s.pos}</span>
    <span><span class="cli">${esc(corto(s.cli))}</span><span class="sub"><span>${esc(tit(s.distrito))}</span>${facs}</span></span>
    <span class="der"><span class="est ${cls(s.est)}">${TXT[s.est]}</span>${hora?`<span class="hr">${hora}</span>`:''}</span></button></li>`;
}
function vistaCamiones(cams){
  const filtrando=hayFiltro();
  const lista=(filtrando?cams.filter(x=>x.filas.some(coincide)):cams).slice().sort(ordenCamion);
  return `<div class="cams">${lista.map(cam=>{
    const abierto=abiertos.has(cam.id)||filtrando;
    const vis=filtrando?cam.paradas.filter(s=>s.filas.some(coincide)):cam.paradas;
    const gps=cam.gps?`<a class="gps" href="https://www.google.com/maps/search/?api=1&query=${cam.gps.lat},${cam.gps.lng}" target="_blank" rel="noopener">${IC.pin}Último reporte ${esc(cam.gps.hora)}</a>`:'';
    return `<section class="panel ${turnoDe(cam)}"><div class="cam-h"><span class="letra">${esc(cam.u.ruta||'·')}</span>
        <div class="tx"><b>${esc(cam.u.placa||'—')}${ubiChip(cam)}</b><small${telTitulo(cam.u)}>${esc(tit(cam.u.personal||''))}${(datos.programaciones||[]).length>1?' · '+esc(tit(cam.prog.turnoTxt||'')):''}</small></div>
        <div class="cuenta"><b>${cam.hechas}<small>/${cam.paradas.length}</small></b><small>paradas atendidas</small></div></div>
      <div class="cam-cuerpo">${via(cam)}
        <div class="cam-pie"><p class="cam-ahora">${fraseCamion(cam)}<small>${cam.conf?'Orden de visita confirmado por el chofer':'Orden programado; el chofer aún no lo confirma'}</small></p>${gps}
          ${filtrando?'':`<button class="ver" data-ver="${esc(cam.id)}" aria-expanded="${abierto}">${abierto?'Ocultar paradas':'Ver las '+cam.paradas.length+' paradas'}</button>`}</div>
        ${abierto?`<ol class="lista">${vis.map(s=>filaParada(cam,s)).join('')}</ol>`:''}</div></section>`;
  }).join('')}</div>`;
}

/* ---------- detalle ---------- */
function buscarCtx(ctx,cams){
  if(ctx.tipo==='fila'){for(const c of cams)for(const f of c.filas)if(f.id===ctx.id)return {cam:c,parada:f.parada,fila:f};}
  else{const c=cams.find(x=>x.id===ctx.cam);if(c){const s=c.paradas.find(x=>x.pos===ctx.pos);if(s)return {cam:c,parada:s,fila:s.filas.length===1?s.filas[0]:null};}}
  return null;
}
function abrirDetalle(ctx,refresco){
  const cams=construir();
  const r=buscarCtx(ctx,cams);
  if(!r){if(refresco)cerrarDetalle();return;}
  detCtx=ctx;
  const {cam,parada:s}=r;
  const est=r.fila?r.fila.est:s.est;
  const filas=r.fila?[r.fila]:s.filas;
  const llega=s.llegada,fin=s.fin;
  const dur=llega?minEntre(llega,fin||null):null;
  /* con una sola factura la frase ya dice el motivo; el recuadro es para paradas con varias */
  const nov=r.fila?'':filas.filter(f=>f.est==='ANULADO'||f.est==='ENTREGA PARCIAL').map(f=>{const e=f.e||{};
    return `<div class="novedad ${cls(f.est)}"><b>${TXT[f.est]} · ${esc(f.p.FACTURA||'sin número')}</b>${esc(f.est==='ANULADO'?(e.motivo||'Sin motivo'):(e.detalle||'Sin detalle'))}</div>`;}).join('');
  const obs=[...new Set(filas.map(f=>f.p.OBSERVACION).filter(Boolean))];
  const ase=[...new Set(filas.map(f=>asesorTxt(f.p)).filter(Boolean))];
  const aseRaw=[...new Set(filas.map(f=>String(f.p.ASESOR||'').trim()).filter(Boolean))];
  const uni=filas.reduce((a,f)=>{a[0]+=+f.p.comp||0;a[1]+=+f.p.partes||0;return a;},[0,0]);
  const quien=filas.map(f=>f.e).filter(e=>e&&e.actualizado).sort((a,b)=>String(b.actualizado).localeCompare(a.actualizado))[0];
  const frase=r.fila?notaPedido(r.fila)
    :s.est==='EN PROCESO'?'<b>El camión está en el cliente</b>'+(llega?' desde las '+hm(llega):'')+'.'
    :FINAL[s.est]?`<b>${TXT[s.est]}</b>${fin?' a las '+hm(fin):''}.`
    :notaPedido({...filas[0],est:'EN RUTA',parada:s,cam});
  const d=$('det');
  d.className='det on '+cls(est);
  d.innerHTML=`<div class="det-cab ${cls(est)}"><button class="det-x" id="dX" aria-label="Cerrar">×</button>
      <span class="est ${cls(est)}">${TXT[est]}</span><h3 id="detTit">${esc(corto(s.cli))}</h3><p>${esc(tit(s.cli))}</p></div>
    <div class="det-cuerpo ${cls(est)}">
      <p class="frase">${frase}</p>${nov}${incHtml(incDe(filas))}
      <dl class="datos">
        <dt>Factura${filas.length>1?'s':''}</dt><dd>${filas.map(f=>esc(f.p.FACTURA||'sin número')+(filas.length>1?' <span class="est '+cls(f.est)+'" style="font-size:11.5px;padding:1px 8px 1px 6px">'+TXT[f.est]+'</span>':'')).join('<br>')}</dd>
        <dt>Camión</dt><dd><span class="placa">${esc(cam.u.placa)}</span> Ruta ${esc(cam.u.ruta||'—')} <span class="${turnoDe(cam)}"><span class="turno-chip">${turnoTxt(cam.prog.turno)}</span></span></dd>
        ${ubiDetalle(cam)}
        ${repartoHtml(cam.u)}
        <dt>Parada</dt><dd>${s.pos} de ${cam.paradas.length}${s.conf?'':' (orden programado)'}</dd>
        ${llega?`<dt>Llegó</dt><dd>${hm(llega)}</dd>`:''}
        ${fin?`<dt>Terminó</dt><dd>${hm(fin)}</dd>`:''}
        ${dur!=null?`<dt>En el cliente</dt><dd>${durTxt(dur)}${fin?'':' hasta ahora'}</dd>`:''}
        <dt>Distrito</dt><dd>${esc(tit(s.distrito))} ${zonaHtml(s.zona)}</dd>
        ${uni[0]||uni[1]?`<dt>Unidades</dt><dd>${uni[0]} completas + ${uni[1]} partes</dd>`:''}
        ${ase.length?`<dt>Asesor / envío</dt><dd>${esc(ase.join(', '))}${aseRaw.some(r=>normH(r)!==normH(ase[0]))?`<span class="ase-var">En el Excel: ${esc(aseRaw.map(tit).join(' / '))}</span>`:''}</dd>`:''}
        ${obs.length?`<dt>Observación</dt><dd>${esc(obs.join(' / '))}</dd>`:''}
        ${quien?`<dt>Último cambio</dt><dd>${hm(quien.actualizado)} por ${esc(quien.usuario||'—')}</dd>`:''}
      </dl>${guiasHtml(filas)}
      <h4>Recorrido del camión</h4>${via(cam,s)}
      <ol class="lista">${cam.paradas.map(x=>filaParada(cam,x)).join('')}</ol>
    </div>`;
  $('velo').classList.add('on');
  $('dX').onclick=cerrarDetalle;
  d.querySelectorAll('[data-par]').forEach(b=>b.onclick=()=>abrirPar(b.dataset.par));
  enlazarTel(d);
  const lf=fotosLista(filas);
  d.querySelectorAll('[data-foto]').forEach(b=>{pedirFoto(b.dataset.foto);
    b.onclick=()=>{const id=b.dataset.foto;if(fotoErr.has(id)){pedirFoto(id);pintarFoto(id);return;}abrirVisor(lf,+b.dataset.i,corto(s.cli));};});
  d.querySelectorAll('[data-gbajar]').forEach(b=>b.onclick=()=>abrirVisor(lf,0,corto(s.cli),'elegir'));
  if(!refresco)$('dX').focus();
}
function abrirPar(v){const i=v.lastIndexOf('|');abrirDetalle({tipo:'par',cam:v.slice(0,i),pos:+v.slice(i+1)});}
function cerrarDetalle(){detCtx=null;$('det').className='det';$('velo').classList.remove('on');}
$('velo').onclick=cerrarDetalle;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&detCtx)cerrarDetalle();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-fila]')){e.preventDefault();abrirDetalle({tipo:'fila',id:e.target.dataset.fila});}
});

/* ---------- eventos ---------- */
let tq=null;
function enlazar(){
  const on=(id,ev,fn)=>{const el=$(id);if(el)el[ev]=fn;};
  on('salir','onclick',()=>{if(confirm('¿Cerrar sesión en este equipo?'))cerrarSesion();});
  on('actualizar','onclick',()=>cargar(false));
  on('diaAnt','onclick',()=>irDia(sumarDias(dia,-1)));
  on('diaSig','onclick',()=>irDia(sumarDias(dia,1)));
  on('diaHoy','onclick',()=>irDia(hoyLima()));
  on('vHoy','onclick',()=>irDia(hoyLima()));
  on('diaBtn','onclick',e=>{e.stopPropagation();calAbierto?cerrarCal():abrirCal();});
  on('reint','onclick',()=>cargar(false));
  on('q','oninput',e=>{F.q=e.target.value;clearTimeout(tq);tq=setTimeout(pintar,180);});
  on('qX','onclick',()=>{F.q='';pintar();$('q').focus();});
  on('ase','onchange',e=>{F.asesor=e.target.value;guardar('seg_asesor',F.asesor);pintar();});
  on('pla','onchange',e=>{F.placa=e.target.value;pintar();});
  on('zon','onchange',e=>{F.zona=e.target.value;pintar();});
  on('tur','onchange',e=>{turno=e.target.value||'todos';guardar('seg_turno',turno);pintar();});
  const quitar=()=>{F.q='';F.asesor='';F.placa='';F.zona='';F.est='';F.tipo='';guardar('seg_asesor','');pintar();};
  on('quitar','onclick',quitar);on('vQuitar','onclick',quitar);
  app.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{F.tipo=F.tipo===b.dataset.tipo?'':b.dataset.tipo;pintar();});
  app.querySelectorAll('[data-est]').forEach(b=>b.onclick=()=>{F.est=F.est===b.dataset.est?'':b.dataset.est;pintar();});
  app.querySelectorAll('[data-vista]').forEach(b=>b.onclick=()=>{vista=b.dataset.vista;guardar('seg_vista2',vista);pintar();});
  app.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const id=b.dataset.seg;cerrados.has(id)?cerrados.delete(id):cerrados.add(id);guardar('seg_cerrados',[...cerrados]);pintar();});
  app.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{const id=b.dataset.ver;abiertos.has(id)?abiertos.delete(id):abiertos.add(id);pintar();});
  app.querySelectorAll('[data-par]').forEach(b=>b.onclick=()=>abrirPar(b.dataset.par));
  app.querySelectorAll('[data-fila]').forEach(b=>b.onclick=()=>abrirDetalle({tipo:'fila',id:b.dataset.fila}));
}
/* ---------- calendario (v17) ---------- */
const IC_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let calAbierto=false,calMes='';                       // calMes: 'AAAA-MM' que se está viendo
const cal=document.createElement('div');cal.className='cal';cal.id='cal';cal.setAttribute('role','dialog');cal.setAttribute('aria-label','Elegir fecha');
document.body.appendChild(cal);
function mesMas(m,n){const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+n,1));return d.toISOString().slice(0,7);}
function pintarCal(foco){
  const y=+calMes.slice(0,4),m=+calMes.slice(5,7)-1,hoy=hoyLima();
  const ini=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7;          // lunes primero
  const p0=sumarDias(calMes+'-01',-ini);
  let g='';
  for(let i=0;i<42;i++){const iso=sumarDias(p0,i);
    if(i===35&&iso.slice(0,7)!==calMes)break;                      // sin sexta fila vacía
    const c=[iso.slice(0,7)!==calMes?'fuera':'',iso===hoy?'hoy-d':'',iso===dia?'sel':'',i%7===6?'dom':''].filter(Boolean).join(' ');
    g+=`<button type="button" data-d="${iso}"${c?` class="${c}"`:''} tabindex="${iso===(foco||dia)?0:-1}" aria-label="${esc(fechaCorta(iso))}${iso===hoy?', hoy':''}"${iso===dia?' aria-pressed="true"':''}>${+iso.slice(8)}</button>`;}
  const r=relDia(dia);
  cal.innerHTML=`<div class="cal-h"><button type="button" data-m="-1" aria-label="Mes anterior">‹</button><b>${MESES[m]} ${y}</b><button type="button" data-m="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal-sem" aria-hidden="true"><span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span></div>
    <div class="cal-g">${g}</div>
    <div class="cal-pie"><button type="button" data-ir="-1"${r==='Ayer'?' class="on"':''}>Ayer</button><button type="button" data-ir="0"${r==='Hoy'?' class="on"':''}>Hoy</button><button type="button" data-ir="1"${r==='Mañana'?' class="on"':''}>Mañana</button></div>`;
  cal.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{calMes=mesMas(calMes,+b.dataset.m);pintarCal();});
  cal.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{cerrarCal();irDia(b.dataset.d);});
  cal.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>{cerrarCal();irDia(sumarDias(hoyLima(),+b.dataset.ir));});
  if(foco){const b=cal.querySelector(`[data-d="${foco}"]`);if(b)b.focus();}
}
function ubicarCal(){
  const a=$('diaBtn');if(!a||!calAbierto)return;
  const r=a.getBoundingClientRect(),w=cal.offsetWidth||300,vw=document.documentElement.clientWidth;
  const left=Math.max(8,Math.min(vw-w-8,r.left+r.width/2-w/2));
  cal.style.left=left+'px';cal.style.top=(r.bottom+10)+'px';
  cal.style.setProperty('--px',(r.left+r.width/2-left)+'px');
}
function abrirCal(){calAbierto=true;calMes=dia.slice(0,7);pintarCal(dia);cal.classList.add('on');ubicarCal();const b=$('diaBtn');if(b)b.setAttribute('aria-expanded','true');}
function cerrarCal(volver){if(!calAbierto)return;calAbierto=false;cal.classList.remove('on');const b=$('diaBtn');if(b){b.setAttribute('aria-expanded','false');if(volver)b.focus();}}
/* composedPath: el clic dentro del calendario cuenta aunque el botón ya se haya redibujado */
document.addEventListener('click',e=>{if(!calAbierto)return;const r=e.composedPath();if(r.includes(cal)||r.some(x=>x&&x.id==='diaBtn'))return;cerrarCal();});
window.addEventListener('resize',ubicarCal);window.addEventListener('scroll',ubicarCal,{passive:true});
cal.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();cerrarCal(true);return;}
  const b=e.target.closest&&e.target.closest('[data-d]');if(!b)return;
  const paso={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(!paso)return;
  e.preventDefault();const iso=sumarDias(b.dataset.d,paso);
  if(iso.slice(0,7)!==calMes)calMes=iso.slice(0,7);
  pintarCal(iso);
});
function irDia(iso){
  if(iso===dia)return;
  dia=iso;datos=null;estMap={};error='';abiertos.clear();cerrarDetalle();
  pintar();cargar(false);
}
function pintarVivo(){
  const ba=$('actualizar');if(ba)ba.classList.toggle('girando',cargando);
  const b=$('vivo');if(!b)return;
  const hoy=dia===hoyLima(), viejo=hoy&&ultCarga&&!cargando&&!error&&Date.now()-ultCarga>90000;
  b.className='vivo'+(cargando?' cargando':error?' error':viejo?' viejo':'');
  b.title=hoy?'Se actualiza solo cada 30 segundos'+(ultCarga?' · última: '+horaLimaS(ultCarga):''):'';
  b.innerHTML='<i></i><span>'+(cargando?'Actualizando…':error?'Sin conexión · reintentando':viejo?'Sin actualizar desde '+horaLima(ultCarga)+' · reintentando':ultCarga?'Actualizado '+horaLima(ultCarga):'')+'</span>';
}

/* ---------- ingreso ---------- */
function pintarIngreso(msg){
  app.innerHTML=`<div class="ingreso"><div class="ing">
    <div class="ing-caja"><div class="ing-cab"><img src="${LOGO}" alt="Provefabrica"></div>
    <form class="ing-form" id="fIng" autocomplete="on">
      <h1>Seguimiento de Pedidos</h1>
      <p>El avance del despacho del día, camión por camión y pedido por pedido.</p>
      <label for="iUsu">Usuario</label><input id="iUsu" autocomplete="username" value="${esc(usuarioEscrito||leer('seg_ultimo',''))}">
      <label for="iCla">Contraseña</label><input id="iCla" type="password" autocomplete="current-password">
      <button class="entrar" id="iBtn" type="submit">Ingresar</button>
      ${msg?`<div class="aviso err">${esc(msg)}</div>`:''}
    </form></div>
    <div class="ing-firma">${FIRMA}</div></div></div>`;
  const u=$('iUsu');(u.value?$('iCla'):u).focus();
  $('fIng').onsubmit=async ev=>{
    ev.preventDefault();
    const usuario=$('iUsu').value.trim(),clave=$('iCla').value;usuarioEscrito=usuario;
    if(!usuario||!clave)return pintarIngreso('Escribe tu usuario y tu contraseña.');
    const b=$('iBtn');b.disabled=true;b.textContent='Ingresando…';
    ses={usuario,clave};claveMem=clave;
    try{
      const r=await pedir({accion:'estadoRuta',fechaDia:dia});
      if(!r||!r.ok){ses=null;claveMem='';return pintarIngreso(motivoIngreso(r));}
      guardar('seg_ses',ses);guardar('seg_ultimo',usuario);
      datos=r;estMap={};(r.estados||[]).forEach(e=>{estMap[e.clave]=e;});indexarInc(r);ultCarga=Date.now();error='';
      pintar();
    }catch(e){ses=null;pintarIngreso('No se pudo conectar: '+e.message+'.');}
  };
}
function cerrarSesion(msg){claveMem='';cerrarVisor();fotoUrl.forEach(u=>URL.revokeObjectURL(u));fotoUrl.clear();fotoNom.clear();fotoErr.clear();ses=null;datos=null;estMap={};try{localStorage.removeItem('seg_ses');}catch(e){}cerrarDetalle();pintarIngreso(msg);}

/* ---------- se mantiene al día solo ---------- */
/* Cada 25 s con la página a la vista. Si el navegador la da por oculta (otra pestaña,
   ventana minimizada o tapada, ahorro de energía) igual consulta, cada 2 min: antes se
   detenía del todo, y Chrome a veces la da por oculta aunque esté en pantalla. */
function tocaActualizar(){
  if(!ses||dia!==hoyLima())return false;
  const cada=document.hidden?120000:25000;
  return Date.now()-Math.max(ultCarga,ultIntento)>cada;
}
setInterval(()=>{if(tocaActualizar())cargar(true);},10000);
/* al volver a la pestaña o a la ventana, al despertar la PC o al recuperar internet: al instante */
function alVolver(){if(ses&&dia===hoyLima()&&!document.hidden&&Date.now()-Math.max(ultCarga,ultIntento)>10000)cargar(true);else pintarVivo();}
document.addEventListener('visibilitychange',alVolver);
window.addEventListener('focus',alVolver);
window.addEventListener('pageshow',alVolver);
window.addEventListener('online',alVolver);
document.addEventListener('resume',alVolver);
setInterval(pintarVivo,15000);

/* v-opt: antes de bajar el archivo completo para ver si hay versión nueva, se pregunta solo por su
   "huella" (ETag) con una consulta HEAD de unos pocos bytes. Si no cambió desde la última revisión,
   no se baja nada; si cambió o el servidor no da huella, se revisa como siempre. */
let verHuella='';
const huellaResp=r=>r&&r.headers?(r.headers.get('etag')||r.headers.get('last-modified')||''):'';
async function versionSinCambio(base){
  if(!verHuella)return false;
  try{const h=await fetch(base+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});const e=h.ok?huellaResp(h):'';return !!e&&e===verHuella;}
  catch(e){return false;}
}
async function revisarVersion(){
  if(location.protocol==='file:')return;
  try{
    const base=location.origin+location.pathname;
    if(await versionSinCambio(base))return;
    const r=await fetch(base+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    verHuella=huellaResp(r);
    const m=(await r.text()).match(/const APP_VERSION\s*=\s*'([^']+)'/);
    if(!m||m[1]===APP_VERSION)return;
    const k='prove_upd_seguimiento';
    if(sessionStorage.getItem(k)===m[1])return;
    sessionStorage.setItem(k,m[1]);
    location.replace(base+'?v='+encodeURIComponent(m[1]));
  }catch(e){}
}

/* ---------- arranque ---------- */
pintar();
if(ses)cargar(false);
revisarVersion();setInterval(revisarVersion,1800000);
</script>
