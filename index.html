/* ===================== v27 · Indicadores de distribución =====================
   Mismo lenguaje de Seguimiento (Barlow, paneles blancos de 16 px, la carretera oscura con su línea
   amarilla). Un solo código de color para los tiempos:
     ámbar  #d97706 = tiempo EN EL CLIENTE (el mismo color de «En el cliente» del tablero, un tono más
                      oscuro para que se lea sobre blanco: contraste ≥ 3:1)
     carretera #2d2d2d = tiempo EN RECORRIDO
   El rojo de marca queda para lo que pide atención (marcas por revisar) y lo activo. */
.ind-main{padding:18px 24px 10px;max-width:1500px;margin:0 auto}
.ind{--amb:#d97706;--amb-bg:#fff4dc;--amb-t:#92400e;--via:#2d2d2d;--linea:#eceef1;--suave3:#8a939d}
.ind .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ind-cab{display:flex;align-items:flex-end;gap:16px;margin:2px 2px 14px}
.ind-cab h2{margin:0;font:700 28px/1.05 var(--cond);letter-spacing:.2px;color:var(--negro)}
.ind-cab p{margin:4px 0 0;color:var(--suave);font-size:14px}

/* filtros: una sola fila sobre todo lo que filtran */
.ind-filtros{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.05);margin-bottom:16px}
.ind-seg{display:inline-flex;background:#f2f3f5;border-radius:11px;padding:3px;gap:2px}
.ind-seg button{border:0;background:transparent;height:34px;padding:0 13px;border-radius:9px;font:600 13.5px/1 var(--txt);color:#5a6570;cursor:pointer;white-space:nowrap}
.ind-seg button:hover{color:var(--negro)}
.ind-seg button.on{background:var(--negro);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.ind-rango{display:flex;gap:8px}
.ind-rango label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--suave)}
.ind-rango input{height:36px;border:1px solid var(--borde);border-radius:9px;padding:0 9px;font:500 13.5px var(--txt);color:var(--negro);background:#fff}
.ind-sel select{height:38px;border:1px solid var(--borde);border-radius:10px;padding:0 32px 0 12px;font:600 13.5px var(--txt);color:var(--negro);background:#fff url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2356616d%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22m7%2010%205%205%205-5%22/%3E%3C/svg%3E") no-repeat right 9px center/16px;appearance:none;-webkit-appearance:none;cursor:pointer}
.ind-quitar{border:0;background:none;color:var(--rojo2);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ind-esp{flex:1}
.ind-estado{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--suave)}
.ind-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border:1px solid var(--borde);background:#fff;border-radius:10px;font:600 13.5px var(--txt);color:var(--negro);cursor:pointer}
.ind-btn svg{width:17px;height:17px}
.ind-btn:hover{border-color:#9ca3af}.ind-btn:disabled{opacity:.45;cursor:default}
.ind-act{width:38px;padding:0;justify-content:center;color:var(--rojo2);border-color:var(--rojo2)}
.ind-act svg{width:18px;height:18px}
.ind-act.girando svg{animation:girar 1s linear infinite}
.ind .gira{width:14px;height:14px;border-radius:50%;border:2px solid #d4d8dd;border-top-color:var(--rojo);display:inline-block;animation:girar .8s linear infinite}
.ind-cuerpo{transition:opacity .2s}
.ind-cuerpo.viejo{opacity:.55}
.ind-vacio{background:#fff;border-radius:16px;padding:54px 20px;text-align:center;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.ind-vacio b{color:var(--negro);font-size:16px}
.ind-vacio button{margin-top:8px;border:0;background:var(--negro);color:#fff;border-radius:10px;height:38px;padding:0 16px;font-weight:600;cursor:pointer}
.ind-vacio .gira{width:22px;height:22px;margin-bottom:6px}
.ind-nada{padding:26px 20px;color:var(--suave);font-size:14px;text-align:center}
.ind-nada.ok{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--term)}
.ind-nada.ok svg{width:18px;height:18px}

/* resumen: UNA franja blanca con 5 celdas del mismo ancho y la misma anatomía
   (título con su muestra de color · valor · P90 · comparación). Sin bordes de colores distintos:
   la muestra junto al título es la misma de la leyenda de la carretera. */
.ind-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.05);margin-bottom:16px;overflow:hidden}
.ind-k{display:grid;grid-template-rows:auto auto auto 1fr;row-gap:6px;padding:16px 20px 15px;min-width:0;border-left:1px solid #f0f1f3}
.ind-k:first-child{border-left:0}
.ind-k-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind-k-h span{overflow:hidden;text-overflow:ellipsis}
.sw{flex:none;display:inline-block}
.sw-cli{width:14px;height:10px;border-radius:3px;background:var(--amb)}
.sw-via{width:20px;height:8px;border-radius:4px;background:var(--via) linear-gradient(90deg,#f5b800 0 4px,transparent 4px 7px) center/7px 1.5px repeat-x}
.sw-alm{width:12px;height:12px;border-radius:50%;background:var(--rojo);box-shadow:0 0 0 2px #fde8ea}
.sw-tot{width:22px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--rojo) 0 6px,var(--via) 6px)}
.sw-conf{width:12px;height:12px;border-radius:50%;background:var(--term-f)}
.ind-k-v{display:flex;align-items:baseline;gap:3px;color:var(--negro);min-height:44px}
.ind-k-v b{font:700 40px/1 var(--cond);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.ind-k-v b.nada{color:#c9ced4}
.ind-k-v i{font:600 16px/1 var(--cond);font-style:normal;color:var(--suave);margin-right:3px}
.ind-k-v small{font-size:12px;color:var(--suave3);margin-left:4px}
.ind-k-medidor{flex:1;align-self:center;height:6px;border-radius:99px;background:#e7f6ec;overflow:hidden;margin-left:10px;max-width:120px}
.ind-k-medidor i{display:block;height:100%;border-radius:99px;background:var(--term-f);margin:0}
.ind-k-s{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--suave);white-space:nowrap;overflow:hidden;min-height:18px}
.ind-k-s .p90{font-weight:700;font-size:10.5px;letter-spacing:.4px;color:#fff;background:#4b5563;border-radius:4px;padding:1px 5px;align-self:center}
.ind-k-s b{font-variant-numeric:tabular-nums;color:var(--negro);font-weight:700}
.ind-k-s em{font-style:normal;color:var(--suave3);overflow:hidden;text-overflow:ellipsis}
.ind-delta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:7px;padding:3px 7px;align-self:end;justify-self:start;background:#f2f3f5;color:var(--suave);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ind-delta i{font-style:normal;font-size:9px}
.ind-delta.bien{background:var(--term-bg);color:var(--term)}
.ind-delta.mal{background:var(--anul-bg);color:var(--anul)}
.ind-delta.nulo{background:none;padding-left:0;color:var(--suave3);font-weight:500}

/* paneles */
.ind-panel{margin-bottom:16px}
.ind-panel .panel-h svg{color:var(--rojo)}
.ind-par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch;margin-bottom:16px}
.ind-par>.panel{margin:0;display:flex;flex-direction:column}
.ind-mas{border:1px solid var(--borde);background:#fff;border-radius:10px;height:34px;padding:0 14px;font:600 13px var(--txt);color:var(--negro);cursor:pointer}
.ind-mas:hover{border-color:#9ca3af}

/* carretera horaria */
.ind-nav{display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0}
.ind-nav b{font:700 15px/1 var(--txt);color:var(--negro);min-width:170px;text-align:center}
.ind-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--borde);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--negro)}
.ind-nav button svg{display:block!important;width:16px;height:16px;color:currentColor!important}
.ind-nav::after{display:none!important}
.ind-nav button:disabled{opacity:.35;cursor:default}
/* La carretera, versión fina: una línea por camión sobre el mismo reloj.
   Línea oscura = en recorrido · bloque ámbar = en el cliente (ancho = minutos) · punto rojo = salida.
   Totales en dos columnas fijas a la derecha, alineados como en una tabla. */
.cr-scroll{overflow-x:auto;scrollbar-width:thin}
.cr-in{min-width:980px;padding:6px 20px 4px}
.cr-eje,.cr-fila{display:grid;grid-template-columns:170px minmax(0,1fr) 168px;column-gap:16px;align-items:center}
.cr-eje>.cr-eh:first-child{position:sticky;left:0;z-index:3;background:#fff;align-self:stretch;display:flex;align-items:center}
.cr-eh{font-size:11.5px;font-weight:700;color:var(--suave3);letter-spacing:.2px}
.cr-horas{position:relative;height:26px}
.cr-horas span{position:absolute;top:7px;transform:translateX(-50%);font-size:11px;color:var(--suave3);font-variant-numeric:tabular-nums}
.cr-fila{min-height:48px;border-top:1px solid #f3f4f6}
.cr-fila:hover{background:#fcfcfd}
.cr-cam{position:sticky;left:0;z-index:3;background:inherit;min-width:0;padding:6px 0}
.cr-fila .cr-cam{background:#fff}
.cr-fila:hover .cr-cam{background:#fcfcfd}
.cr-cam b{display:block;font:700 15.5px/1.1 var(--cond);letter-spacing:.3px;color:var(--negro)}
.cr-cam small{display:block;font-size:11.5px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-tot{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:right;font-variant-numeric:tabular-nums}
.cr-fila .cr-tot span{font-size:13px;font-weight:600;color:var(--negro)}
.cr-fila .cr-tot span:first-child{color:var(--amb-t)}
.cr-pista{position:relative;height:48px}
.cr-pista>i{position:absolute;top:0;bottom:0;width:1px;background:#f1f2f4}
.cr-via{position:absolute;top:22px;height:4px;border-radius:2px;background:#3a3f45}
.cr-via.sin-salida{-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px);mask-image:linear-gradient(90deg,transparent,#000 18px)}
.cr-tramo{position:absolute;top:14px;height:20px;border:0;background:transparent;padding:0;cursor:pointer;border-radius:6px}
.cr-tramo:hover,.cr-tramo:focus-visible{background:rgba(58,63,69,.10);outline:none}
.cr-par{position:absolute;top:15px;height:18px;min-width:5px;border:0;border-radius:4px;background:var(--amb);box-shadow:0 0 0 2px #fff;padding:0;cursor:pointer}
.cr-par:hover,.cr-par:focus-visible{background:#b45309;outline:none;z-index:2;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--negro)}
.cr-par.raro{background:repeating-linear-gradient(135deg,#fecaca 0 3px,#fff 3px 6px);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--rojo)}
.cr-pin{position:absolute;top:17px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2.5px solid var(--amb);background:#fff;padding:0;cursor:pointer}
.cr-pin.raro{border-color:var(--rojo);border-style:dashed}
.cr-pin:hover,.cr-pin:focus-visible{outline:2px solid var(--negro);outline-offset:1px}
.cr-sal{position:absolute;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:0;background:var(--rojo);box-shadow:0 0 0 2.5px #fff,0 0 0 3.5px rgba(225,0,26,.35);padding:0;cursor:pointer;z-index:1}
.cr-sal:hover,.cr-sal:focus-visible{outline:2px solid var(--negro);outline-offset:3px}
.cr-ley{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 20px 14px;border-top:1px solid #f3f4f6;font-size:12px;color:var(--suave)}
.cr-ley span{display:inline-flex;align-items:center;gap:6px}
.cr-ley i{display:inline-block;flex:none}
.cr-ley .k-cli i{width:16px;height:10px;border-radius:3px;background:var(--amb)}
.cr-ley .k-via i{width:20px;height:4px;border-radius:2px;background:#3a3f45}
.cr-ley .k-sal i{width:10px;height:10px;border-radius:50%;background:var(--rojo)}
.cr-ley .k-pin i{width:10px;height:10px;border-radius:50%;border:2px solid var(--amb)}
.cr-ley .k-raro i{width:16px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,#fecaca 0 3px,#fff 3px 6px);box-shadow:0 0 0 1px var(--rojo)}
.cr-ayuda{margin-left:auto;color:var(--suave3)}

/* por camión */
.ind-tabla{overflow-x:auto}
.ind-t{width:100%;border-collapse:collapse;font-size:13.5px}
.ind-t th,.ind-t td{padding:10px 12px;text-align:left;border-bottom:1px solid #f1f2f4;vertical-align:middle}
.ind-t thead th{font-size:12px;font-weight:700;color:var(--suave);background:#fcfcfd;white-space:nowrap}
.ind-t tbody tr{cursor:pointer}
.ind-t tbody tr:hover td,.ind-t tbody tr:hover th{background:#fafbfc}
.ind-t tbody tr:focus-visible{outline:2px solid var(--rojo);outline-offset:-2px}
.ind-t tbody th b{display:block;font:700 16px/1.1 var(--cond);letter-spacing:.3px}
.ind-t tbody th small{display:block;font-weight:500;font-size:12px;color:var(--suave);white-space:nowrap}
.ind-t .n{text-align:right;font-variant-numeric:tabular-nums}
.ind-t .t b{display:block;font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--negro)}
.ind-t .t small{display:block;font-size:11.5px;color:var(--suave3);font-variant-numeric:tabular-nums}
.ind-t .t.cli b{color:var(--amb-t)}
.ind-t .c{min-width:110px}
.ind-t .c span{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ind-mini{height:6px;border-radius:99px;background:#eef0f2;margin-bottom:5px;overflow:hidden}
.ind-mini i{display:block;height:100%;background:var(--term-f);border-radius:99px}
.ind-mini i.baja{background:var(--proc-f)}
.ind-sin{color:#c3c8ce}

/* clientes y recorridos: la misma fila en las dos tarjetas
   (puesto · nombre y detalle · barra · valor), 6 filas y el mismo pie */
.rk{list-style:none;margin:0;padding:4px 20px;flex:1}
.rk.abierto{max-height:calc(6 * 57px);overflow-y:auto;scrollbar-width:thin}
.rk li{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(70px,28%) 78px;gap:12px;align-items:center;height:57px;border-bottom:1px solid #f4f5f6}
.rk li:last-child{border-bottom:0}
.rk-n{font:700 15px/1 var(--cond);color:var(--suave3);text-align:right;font-variant-numeric:tabular-nums}
.rk-t{min-width:0}
.rk-t b{display:block;font-size:13.5px;font-weight:700;color:var(--negro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-t b i{font-style:normal;color:var(--suave3);font-weight:600;margin:0 2px}
.rk-t small{display:block;font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rk-b{position:relative;height:10px;border-radius:5px;background:#f2f3f5}
.rk-b .med{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.rk-b.cli .med{background:var(--amb)}
.rk-b.reco .med{background:var(--via) linear-gradient(90deg,#f5b800 0 5px,transparent 5px 9px) left center/9px 1.5px repeat-x}
.rk-b .p90{position:absolute;top:-3px;width:2px;height:16px;margin-left:-1px;background:var(--negro);border-radius:1px}
.rk-v{text-align:right;white-space:nowrap}
.rk-v b{display:block;font:700 18px/1.05 var(--cond);color:var(--negro);font-variant-numeric:tabular-nums}
.rk-v small{font-size:11.5px;color:var(--suave3);font-variant-numeric:tabular-nums}
.rk-pie{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px 20px 12px;border-top:1px solid #f4f5f6}
.ind-pie-nota{font-size:12px;color:var(--suave3)}
.ind-rk .ind-nada{flex:1;display:flex;align-items:center;justify-content:center}

/* por revisar: tabla a todo el ancho */
.rv-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px}
.rv-chips button{border:1px solid var(--borde);background:#fff;border-radius:99px;height:30px;padding:0 11px;font:600 12.5px var(--txt);color:#374151;cursor:pointer}
.rv-chips button b{margin-left:3px;color:var(--rojo3)}
.rv-chips button.on{background:var(--negro);border-color:var(--negro);color:#fff}
.rv-chips button.on b{color:#fca5a5}
.rv-t tbody tr{cursor:default}
.rv-t td{vertical-align:top}
.rv-f{width:76px}
.rv-f b,.rv-p b{display:block;font:700 15px/1.1 var(--cond);letter-spacing:.3px;color:var(--negro)}
.rv-f small{display:block;font-size:11.5px;color:var(--suave3);font-variant-numeric:tabular-nums}
.rv-p{width:96px}
.rv-k{width:250px}
.rv-tag{display:inline-flex;align-items:center;gap:6px;border-radius:7px;background:var(--rojo-claro);color:var(--rojo3);font-size:12.5px;font-weight:700;padding:4px 8px;white-space:nowrap}
.rv-tag svg{width:14px;height:14px;flex:none}
.rv-d b{display:block;font-size:13.5px;color:var(--negro)}
.rv-d b:empty{display:none}
.rv-d span{display:block;font-size:13px;color:#4b5563}
.rv-u{width:150px;font-size:12.5px;color:var(--suave);font-weight:600}
.ind-rv .rk-pie{border-top:0}

/* cómo se calcula */
.ind-como{background:#fff;border-radius:16px;padding:4px 20px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:10px}
.ind-como summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:14px;color:#374151}
.ind-como dl{margin:0 0 14px;display:grid;grid-template-columns:220px 1fr;gap:8px 18px;font-size:13.5px;line-height:1.45}
.ind-como dt{font-weight:700;color:var(--negro)}
.ind-como dd{margin:0;color:#374151}

/* tooltip */
.ind-tip{position:fixed;z-index:80;max-width:280px;background:#1a1a1a;color:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:13px}
.ind-tip.on{opacity:1;transform:none}
.ind-tip>b{display:block;font-size:14px}
.ind-tip>small{display:block;color:#aab2bc;font-size:12px;margin-top:1px}
.ind-tip dl{margin:7px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.ind-tip dt{color:#aab2bc}
.ind-tip dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:1250px){
  .ind-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
  .ind-k{grid-column:span 2;border-top:1px solid #f0f1f3}
  .ind-k:nth-child(-n+3){border-top:0}
  .ind-k:nth-child(4),.ind-k:nth-child(5){grid-column:span 3}
  .ind-k:nth-child(4){border-left:0}
}
@media (max-width:1100px){.ind-par{grid-template-columns:1fr}.rk.abierto{max-height:none}}
@media (max-width:760px){
  .ind-main{padding:12px 10px 6px}
  .ind-cab h2{font-size:24px}
  .ind-filtros{padding:10px;gap:8px}
  .ind-seg{width:100%;overflow-x:auto;scrollbar-width:none}
  .ind-seg button{padding:0 11px;flex:none}
  .ind-rango{width:100%}.ind-rango label{flex:1}.ind-rango input{width:100%}
  .ind-sel{flex:1 1 calc(50% - 8px)}.ind-sel select{width:100%}
  .ind-esp{display:none}
  .ind-estado{flex:1;order:8;font-size:12.5px}
  .ind-btn{order:9}
  .ind-btn span{display:none}
  .ind-btn#indCsv{width:38px;padding:0;justify-content:center}
  .ind-tabla{overflow:visible}
  .ind-t thead{display:none}
  .ind-t,.ind-t tbody{display:block}
  .ind-t tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px 16px;border-bottom:1px solid #f1f2f4}
  .ind-t th,.ind-t td{padding:0;border:0}
  .ind-t tbody th{grid-column:1/-1}
  .ind-t td::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--suave3);margin-bottom:2px}
  .ind-t td.n{text-align:left;font-weight:700}
  .ind-t td.c{grid-column:1/-1}
  .ind-kpis{grid-template-columns:1fr 1fr}
  .ind-k,.ind-k:nth-child(4),.ind-k:nth-child(5){grid-column:span 1;padding:13px 14px 12px;border-left:1px solid #f0f1f3;border-top:1px solid #f0f1f3}
  .ind-k:nth-child(odd){border-left:0}
  .ind-k:nth-child(-n+2){border-top:0}
  .ind-k:nth-child(3){border-top:1px solid #f0f1f3}
  .ind-k.conf{grid-column:1/-1}
  .ind-k-v b{font-size:34px}
  .ind-k-s em{display:none}
  .ind-delta .lg{display:none}
  .ind-k.conf .ind-k-s em{display:inline}
  .ind-delta{font-size:11.5px}
  .ind-nav b{min-width:0;font-size:13.5px}
  .cr-in{min-width:720px;padding:4px 12px 4px}
  .cr-eje,.cr-fila{grid-template-columns:104px minmax(0,1fr);column-gap:10px}
  .cr-tot{display:none}
  .cr-ayuda{margin-left:0;flex-basis:100%}
  .cr-ley{padding:10px 14px 12px}
  .rk{padding:4px 14px}
  .rk li{grid-template-columns:18px minmax(0,1fr) 70px;grid-template-rows:auto auto;row-gap:6px;height:auto;padding:10px 0}
  .rk-n{grid-row:span 2;align-self:start;padding-top:2px}
  .rk-b{grid-column:2/-1;grid-row:2}
  .rk-v{grid-column:3;grid-row:1}
  .rk.abierto{max-height:none}
  .rv-chips{padding:12px 14px}
  .rv-t tr{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:12px 14px}
  .rv-t td::before{display:none}
  .rv-f,.rv-p,.rv-k,.rv-u{width:auto}
  .rv-t .rv-k{grid-column:1/3;grid-row:1}
  .rv-t .rv-f{grid-column:3;grid-row:1;text-align:right;white-space:nowrap}
  .rv-t .rv-f b,.rv-t .rv-f small{display:inline;margin-left:5px}
  .rv-t .rv-d{grid-column:1/-1;grid-row:2}
  .rv-t .rv-p{grid-column:1;grid-row:3}
  .rv-t .rv-p b{font-size:14px}
  .rv-t .rv-u{grid-column:2/-1;grid-row:3;font-size:12px}
  .rv-t .rv-u::before{display:inline;content:"marcó ";font-weight:500;color:var(--suave3)}
  .ind-como dl{grid-template-columns:1fr;gap:2px}
  .ind-como dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.ind .gira{animation:none}.ind-tip{transition:none}}

/* v28: celda del camión — placa como en el resto de Seguimiento; al lado, el equipo del periodo:
   chofer (fijo) con su volante y los ayudantes (rotan) como un grupo de iniciales. El detalle sale en la burbuja. */
.cam-cel{display:flex;align-items:center;gap:14px;min-width:0}
.cam-cel .placa{flex:none;min-width:84px;text-align:center;font-size:16px;padding:6px 8px 4px}
.eqp{all:unset;box-sizing:border-box;display:grid;gap:5px;min-width:0;padding:4px 8px;margin:-4px -8px;border-radius:9px;cursor:pointer;transition:background .12s}
.eqp:hover{background:#f1f3f5}
.eqp:focus-visible{outline:2px solid var(--rojo);outline-offset:1px}
.eqp-ch{display:flex;align-items:center;gap:6px;min-width:0;font-size:13.5px;font-weight:600;color:var(--texto);line-height:1.15}
.eqp-ch svg{width:14px;height:14px;flex:none;color:var(--suave2)}
.eqp-ch>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqp-ch.ext{color:var(--suave);font-weight:500}
.eqp-ch em{flex:none;font-style:normal;font-size:10.5px;font-weight:700;color:#8a5a00;background:#fff4dc;border-radius:99px;padding:2px 7px 1px}
.eqp-ay{display:flex;align-items:center;gap:7px}
.eqp-av{display:flex;padding-left:4px}
.eqp-av i{width:22px;height:22px;margin-left:-5px;border-radius:50%;display:grid;place-items:center;font:700 9.5px/1 var(--cond);letter-spacing:.3px;font-style:normal;color:#3a3a3a;background:#e9ecef;box-shadow:0 0 0 2px #fff}
.eqp-av i.ext{background:#fff;color:var(--suave2);box-shadow:0 0 0 2px #fff,inset 0 0 0 1px #c9cfd6}
.eqp-av i.mas{background:var(--negro);color:#fff}
.eqp-ay small{font-size:12px;color:var(--suave);white-space:nowrap}
.ind-t tbody tr:hover .eqp-av i{box-shadow:0 0 0 2px #fafbfc}
.ind-t tbody tr:hover .eqp-av i.ext{box-shadow:0 0 0 2px #fafbfc,inset 0 0 0 1px #c9cfd6}
@media (max-width:760px){.cam-cel{gap:12px}.cam-cel .placa{font-size:17px}}

/* ===== v28 · Tablero del día: la «carretera» de cada camión =====
   Como el ícono de Mi Ruta: una vía con las paradas numeradas. El tramo que llega a cada parada se pinta con su
   estado (verde terminado, ámbar en el cliente, morado parcial, rojo anulado; gris punteado lo que falta) y el
   tramo hacia la próxima parada se mueve. Debajo de cada estación, su tarjeta con aire: hora, cliente en dos
   líneas sin cortar palabras, distrito y facturas sin superponerse. */
.tb{grid-template-columns:222px repeat(var(--n),minmax(126px,1fr));column-gap:0;row-gap:14px;min-width:calc(222px + var(--n) * 126px)}
.tb-col{padding-bottom:0}
.tb-cab{margin-right:12px;position:sticky;left:0;z-index:3;box-shadow:-14px 0 0 #fff,0 1px 2px rgba(16,24,40,.04)}
.tb .tile,.tb .tile.c-EN_PROCESO,.tb .tile.c-ANULADO,.tb .tile.c-TERMINADO,.tb .tile.c-ENTREGA_PARCIAL,.tb .tile.c-EN_RUTA,.tb .tile.con-inc,.tb .tile.marcado,.tb .tile:hover{background:none!important;border:0!important;box-shadow:none!important;outline:0!important}
.tb .tile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;min-width:0;padding:0 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb .tile .t1{position:relative;height:26px;display:flex;align-items:center;padding-left:2px}
.tb .tile .t1::before{content:"";position:absolute;top:50%;height:4px;margin-top:-2px;left:calc(16px - 100% - 8px);width:calc(100% + 8px);border-radius:2px;background:var(--cf);z-index:0}
.tb .tile.pri .t1::before{left:-16px;width:32px}
.tb .tile.c-EN_RUTA .t1::before{background:repeating-linear-gradient(90deg,#c3c9d1 0 7px,transparent 7px 13px)}
.tb .tile.sig .t1::before{background:repeating-linear-gradient(90deg,var(--negro) 0 7px,transparent 7px 13px);background-size:26px 4px;animation:avanza 1.1s linear infinite}
@keyframes avanza{to{background-position:26px 0}}
.tb .tile .n{position:relative;z-index:2;width:26px;height:26px;font-size:14px;box-shadow:0 0 0 3px #fff!important}
.tb .tile.c-EN_RUTA .n{background:#fff;color:var(--texto);box-shadow:0 0 0 3px #fff,inset 0 0 0 2px #b8c0c9!important}
.tb .tile.sig .n{background:var(--negro);color:#fff;box-shadow:0 0 0 3px #fff!important}
.tb .tile.c-EN_PROCESO .n{animation:latido 1.8s ease-out infinite}
.tb .tile.meta .n::after{content:"";position:absolute;left:100%;top:50%;width:20px;height:4px;margin-top:-2px;background:var(--cf)}
.tb .tile.meta .t1::after{content:"";position:absolute;z-index:1;top:50%;margin-top:-7px;left:50px;width:14px;height:14px;border-radius:3px;
  background:conic-gradient(var(--negro) 25%,#fff 0 50%,var(--negro) 0 75%,#fff 0) 0 0/7px 7px;box-shadow:0 0 0 2px #fff,0 0 0 3px #d5dae0}
.tb .tile .cuerpo{flex:1;display:flex;flex-direction:column;gap:5px;margin-top:7px;min-height:94px;padding:8px 10px 9px;background:#fff;border:1px solid #e7eaee;border-radius:11px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease}
.tb .tile:hover .cuerpo{box-shadow:0 8px 20px rgba(16,24,40,.10);transform:translateY(-1px);border-color:#d9dde3}
.tb .tile:focus-visible .cuerpo{outline:2px solid var(--rojo);outline-offset:2px}
.tb .tile .c-top{display:flex;align-items:center;gap:6px;min-height:20px}
.tb .tile .h{margin:0;font:700 15px/1 var(--cond);letter-spacing:.2px;color:var(--c)}
.tb .tile .c-ic{display:flex;align-items:center;gap:4px;margin-left:auto}
.tb .tile .c-ic .inc-m,.tb .tile .c-ic .foto-m{margin:0!important;box-shadow:none}
.tb .tile .cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 13px/1.28 var(--txt)!important;letter-spacing:0!important;text-transform:none!important;color:var(--texto);hyphens:manual;-webkit-hyphens:manual;overflow-wrap:break-word;text-wrap:balance}
.tb .tile .pie{margin-top:auto;display:flex;align-items:center;gap:6px;min-width:0}
.tb .tile .d{position:static;margin:0;flex:1;min-width:0;font-size:11.5px}
.tb .tile .k{position:static;flex:none;font-size:10.5px;padding:2px 6px;border-radius:6px;background:#f1f3f5;color:var(--suave)}
/* estado en la tarjeta: discreto, el color fuerte va en la vía y el número */
.tb .tile.c-EN_RUTA .cuerpo{background:#fbfbfc}
.tb .tile.t2.c-EN_RUTA .cuerpo{background:var(--tbg,#fbfbfc)}
.tb .tile.c-EN_RUTA .cl{color:#3d4650}
.tb .tile.c-EN_PROCESO .cuerpo{background:#fffaf0;border-color:#f6cf86;box-shadow:0 0 0 3px rgba(245,158,11,.14)}
.tb .tile.c-ENTREGA_PARCIAL .cuerpo{background:#faf7ff;border-color:#ddd0fb}
.tb .tile.c-ANULADO .cuerpo{background:#fff8f8;border-color:#f3caca}
.tb .tile.c-ANULADO .cl{text-decoration:line-through;text-decoration-thickness:1.5px;color:#8a1020}
.tb .tile.sig .cuerpo{border:1.5px dashed var(--negro);padding:7.5px 9.5px 8.5px}
.tb .tile.sig .c-top::before{content:"Próxima";font:700 10.5px/1 var(--txt);letter-spacing:.3px;color:#fff;background:var(--negro);border-radius:99px;padding:4px 8px 3px}
.tb .tile.con-inc .cuerpo{box-shadow:inset 0 -3px 0 #f2b45a}
.tb .tile.marcado .cuerpo{box-shadow:0 0 0 3px var(--rojo)}
.tb .tile.apagado{opacity:.28}
@media (prefers-reduced-motion:reduce){.tb .tile.sig .t1::before{animation:none}.tb .tile:hover .cuerpo{transform:none}}
</style>
</head>

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function leer(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function guardar(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function sinTilde(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function normCli(x){return sinTilde(x).replace(/[^A-Z0-9]/g,'');}
function normH(x){return sinTilde(x).replace(/\s+/g,' ').trim();}
function zColor(z){return ZCOL[normH(z)]||'#475569';}
/* ---- asesores y tipos de envío ----
   La columna ASESOR del Excel mezcla nombres de asesores con tipos de envío
   ("Envio garantia de 8-5:30", "Oficina"…) y repite a una misma persona escrita
   de varias formas ("Provisional Ingrid Orellana" = "Orellana De La Cruz Ingrid
   Ledka"; "Alvarado Mario" = "Provisional Mario Alvarado"). Aquí se agrupa. */
const NEXOS=new Set(['DE','LA','DEL','LOS','LAS','Y','E','DA']);
let ASE={mapa:new Map(),personas:[],envios:[]};
function clasificar(raw){
  const n=normH(raw);
  if(/GARANTIA/.test(n))return {tipo:'envio',key:'E:GARANTIA',txt:'Envío de garantía'};
  if(/^OFICINA\b|\bOFICINA$/.test(n))return {tipo:'envio',key:'E:OFICINA',txt:'Oficina'};
  if(/^(ENVIO|ENVIOS|RETIRO|RECOJO|MUESTRA|MUESTRAS|TRASLADO|DEVOLUCION|CAMBIO|REPOSICION)\b/.test(n))return {tipo:'envio',key:'E:OTRO',txt:'Otros envíos'};
  const prov=/\bPROVISIONAL\b/.test(n);
  const limpio=String(raw).replace(/provisional/ig,' ').replace(/\s+/g,' ').trim();
  const toks=normH(limpio).replace(/[^A-Z ]/g,' ').split(/\s+/).filter(t=>t.length>1&&!NEXOS.has(t));
  return {tipo:'persona',prov,limpio,toks};
}
function parecido(a,b){
  if(!a.length||!b.length)return false;
  const [m,M]=a.length<=b.length?[a,b]:[b,a];
  return (m.length>=2||M.length===1)&&m.every(t=>M.includes(t));
}
function prepararAsesores(peds){
  const mapa=new Map(),envios=new Map(),personas=[],vistos=new Set();
  peds.forEach(p=>{
    const raw=String(p.ASESOR||'').trim(),n=normH(raw);
    if(!n||vistos.has(n))return;vistos.add(n);
    const c=clasificar(raw);
    if(c.tipo==='envio'){

function estadoParada(lista){
  if(lista.some(e=>e==='EN PROCESO'))return 'EN PROCESO';
  if(lista.every(e=>FINAL[e])){
    if(lista.every(e=>e==='ANULADO'))return 'ANULADO';
    if(lista.every(e=>e==='TERMINADO'))return 'TERMINADO';
    return 'ENTREGA PARCIAL';
  }
  if(lista.some(e=>FINAL[e]))return 'EN PROCESO';
  return 'EN RUTA';
}
function progsDelTurno(){

function construir(){
  const camiones=[];

    const ps=(p.pedidos||[]).filter(x=>x.unitId===u.id).sort((a,b)=>(a.seq||999)-(b.seq||999)||a.id-b.id);
    if(!ps.length)return;

    const paradas=[],idxP=new Map();
    filas.forEach(f=>{const c=normCli(f.p.CLIENTES),k=c?c+'|'+normCli(f.p.DISTRITO):'ID'+f.id;let s=idxP.get(k);
      if(!s){s={k,filas:[]};idxP.set(k,s);paradas.push(s);}s.filas.push(f);});
    paradas.forEach((s,i)=>{
      s.n=i+1;

      s.ord=ords.length?Math.min(...ords):0;
      s.conf=s.filas.some(f=>f.e&&f.e.ordenConfirmado);
      s.est=estadoParada(s.filas.map(f=>f.est));

      const fi=s.filas.map(f=>f.e&&f.e.horaFin).filter(Boolean).sort();

      s.cli=s.filas[0].p.CLIENTES;s.distrito=s.filas[0].p.DISTRITO;s.zona=s.filas[0].p.ZONA;

    cam.conf=paradas.some(s=>s.conf);
    cam.fin=cam.listo?paradas.map(s=>s.fin).filter(Boolean).sort().pop()||'':'';
    const g=filas.filter(f=>f.e&&f.e.lat!==''&&f.e.lat!=null&&f.e.lng!==''&&f.e.lng!=null&&+f.e.tsCliente).sort((a,b)=>b.e.tsCliente-a.e.tsCliente)[0];

function indRango(){

    case 'hoy':return [h,h];

    case 'mesAnt':{const f=sumarDias(h.slice(0,7)+'-01',-1);return [f.slice(0,7)+'-01',f];}
    case 'rango':{let a=IND.desde||sumarDias(h,-6),b=IND.hasta||h;if(a>b){const t=a;a=b;b=t;}
      if(indDias(a,b)>62)a=sumarDias(b,-61);return [a,b];}

function indDias(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5)+1;}

async function indTraer(a,b){
  let regs=[],sal=[],desde=a;

    if(!r||!r.ok){const e=new Error((r&&r.error)||'respuesta inválida');e.sinPermiso=!!(r&&r.sinPermiso);e.auth=esAuth(r&&r.error);throw e;}

        det:'«Llegué» a '+corto(b.cli)+' ('+hm(b.ll)+') antes de cerrar '+corto(a.cli)+' ('+hm(a.fi)+')',us:[...new Set(a.users.concat(b.users))]});
    }
    /* «Llegué» lejos del cliente: dónde estaba el celular al tocar «Llegué» comparado con la ubicación
       confirmada del cliente o, si aún no la tiene, con donde se cerró la parada. AUDITORÍA 2: contra donde
       se cerró solo si ese cierre es confiable; si la parada ya está en lote, más de 4 h u horas cruzadas,
       el cierre pudo hacerse en otro lugar y culparía al «Llegué» sin razón. */
    vis.forEach(s=>{
      if(!s.ll||!FINAL[s.est])return;
      const fl=s.fs.find(f=>f.pa!=null&&f.po!=null&&isFinite(f.pa)&&!(f.pa===0&&f.po===0)),fc=s.fs.find(f=>f.ca!=null&&f.co!=null&&isFinite(f.ca));
      if(!fl)return;
      const cierreDudoso=s.flags.some(f=>f==='lote'||f==='largo'||f==='cruce');
      const ref=fc?[fc.ca,fc.co]:(s.la!=null&&!cierreDudoso)?[s.la,s.lo]:null;
      if(ref){s.distLl=dist([fl.pa,fl.po],ref);s.refConf=!!fc;if(s.distLl>IND_LEJOS_M)s.flags.push('lejos');}
    });
    vis.forEach(s=>s.flags.forEach(f=>{
      if(f==='lote'||f==='cruce')return;
      const det=f==='corto'?Math.max(0,Math.round(s.min*60))+' s entre «Llegué» y el fin'
        :f==='largo'?durTxt(Math.round(s.min))+' en el cliente: ¿se olvidó cerrar la parada?'
        :f==='lejos'?(s.refConf?'«Llegué» se tocó a '+indDistTxt(s.distLl)+' de la ubicación confirmada del cliente: ¿lo marcaron antes de llegar?'
          :'«Llegué» y el cierre se marcaron a '+indDistTxt(s.distLl)+' uno del otro: o tocaron «Llegué» antes de llegar o cerraron la parada lejos')
        :'Pasó directo a '+TXT[s.est].toLowerCase()+': no se puede medir su tiempo en el cliente';
      rev.push({tipo:f,d:c.d,t:c.t,pl:c.pl,hora:hm(s.ll||s.fi),cli:corto(s.cli),det,us:s.users});
    }));
    /* tramos entre clientes, en el orden real de visita. AUDITORÍA 22/11: un tramo no entra si una de sus
       dos horas viene de una marca dudosa: el cierre del anterior (lote, más de 4 h, lejos, cruzado) o la
       llegada al siguiente («Llegué» tarde <1 min, lejos, cruzado, lote). Antes solo se excluía el lote. */
    const MAL_FIN=['lote','largo','lejos','cruce'],MAL_LL=['lote','corto','lejos','cruce'];
    c.tramos=[];
    for(let i=1;i<vis.length;i++){
      const a=vis[i-1],b=vis[i];if(!a.fi||!b.ll)continue;
      const t={a,b,min:indMinEntre(a.fi,b.ll),km:a.la!=null&&b.la!=null?indKm(a,b):null,cam:c,flags:[]};
      if(t.min<0)t.flags.push('cruce');
      else if(a.flags.some(f=>MAL_FIN.includes(f))||b.flags.some(f=>MAL_LL.includes(f)))t.flags.push('dudoso');
      c.tramos.push(t);
    }
    /* salida del almacén */
    const sl=salDe[c.p+'|'+normPl(c.pl)];c.sal=sl?sl.h:'';c.salPor=sl?(sl.n||sl.u):'';
    if(c.sal&&vis.length){
      const f=vis[0];
      if(f.ll){c.alm={min:indMinEntre(c.sal,f.ll),flags:[]};
        if(c.alm.min<0){c.alm.flags.push('salidaTarde');rev.push({tipo:'salidaTarde',d:c.d,t:c.t,pl:c.pl,hora:hm(c.sal),cli:corto(f.cli),
          det:'La salida ('+hm(c.sal)+') quedó después de llegar al primer cliente ('+hm(f.ll)+')',us:[sl.u].filter(Boolean)});}
        else if(f.flags.some(x=>MAL_LL.includes(x)))c.alm.flags.push('dudoso');}   // la llegada al 1er cliente es dudosa
      /* ruta completa: hasta el ÚLTIMO cierre real (no siempre es el último cliente visitado) */
      const fin=vis.filter(s=>s.fi&&FINAL[s.est]).sort((a,b)=>indMs(a.fi)-indMs(b.fi)),u=fin[fin.length-1];
      if(u&&c.paradas.every(s=>FINAL[s.est])){c.total={min:indMinEntre(c.sal,u.fi),flags:[]};
        if(c.total.min<0||u.flags.some(x=>MAL_FIN.includes(x)))c.total.flags.push('dudoso');}
    }
    c.base=vis.filter(s=>FINAL[s.est]).length;
    c.limpias=vis.filter(s=>FINAL[s.est]&&!s.flags.length).length;
  });
  const lista=[...cams.values()].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t.localeCompare(b.t)||String(a.ru).localeCompare(String(b.ru))||a.pl.localeCompare(b.pl));
  rev.sort((a,b)=>(b.d+b.hora).localeCompare(a.d+a.hora));
  return {cams:lista,rev};
}
/* mediana y percentil 90 (interpolación lineal, como Excel PERCENTIL.INC) */
function indPct(v,p){if(!v.length)return null;const s=v.slice().sort((a,b)=>a-b),i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo);}
function indStats(v){return {n:v.length,med:indPct(v,.5),p90:indPct(v,.9)};}
function indMedidas(cams){
  const enCli=[],entre=[],km=[],alm=[],total=[],porHora=[];let base=0,limpias=0;
  cams.forEach(c=>{
    c.vis.forEach(s=>{if(s.min!=null&&!s.flags.length&&FINAL[s.est])enCli.push(s.min);});
    c.tramos.forEach(t=>{if(!t.flags.length){entre.push(t.min);if(t.km!=null)km.push(t.km);}});
    if(c.alm&&!c.alm.flags.length)alm.push(c.alm.min);
    if(c.total&&!c.total.flags.length){total.push(c.total.min);if(c.total.min>0)porHora.push(c.base/(c.total.min/60));}
    base+=c.base;limpias+=c.limpias;
  });
  return {enCli:indStats(enCli),entre:indStats(entre),km:indStats(km),alm:indStats(alm),total:indStats(total),porHora:indStats(porHora),base,limpias,
    conf:base?limpias/base:null,visitas:cams.reduce((x,c)=>x+c.vis.length,0),camiones:cams.length,dias:new Set(cams.map(c=>c.d)).size};
}

/* ---------- formato ---------- */
function indDur(m){
  if(m==null||!isFinite(m))return '—';
  m=Math.round(m);if(m<60)return m+' min';
  return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
}
function indDurHtml(m){
  if(m==null||!isFinite(m))return '<b>—</b>';
  m=Math.round(m);if(m<60)return `<b>${m}</b><i>min</i>`;
  return `<b>${Math.floor(m/60)}</b><i>h</i><b>${String(m%60).padStart(2,'0')}</b>`;
}
const indDistTxt=m=>m<1000?Math.round(m/10)*10+' m':indKmTxt(m/1000);
const indKmTxt=k=>k==null?'—':(k<10?k.toFixed(1).replace('.',','):Math.round(k))+' km';
function indDelta(act,ant,menosMejor){
  if(act==null||ant==null||!isFinite(act)||!isFinite(ant))return '';
  const d=act-ant,abs=Math.abs(d);
  const unidad=menosMejor===null?'pts':'min';
  if((unidad==='min'&&abs<1)||(unidad==='pts'&&abs<1))return `<span class="ind-delta igual"><span>= igual<span class="lg"> que el periodo anterior</span></span></span>`;
  const bueno=menosMejor===null?d>0:menosMejor?d<0:d>0;
  const txt=unidad==='pts'?Math.round(abs)+' pts':indDur(abs);
  return `<span class="ind-delta ${bueno?'bien':'mal'}"><i aria-hidden="true">${d<0?'▼':'▲'}</i><span>${txt} ${d<0?'menos':'más'}<span class="lg"> que el periodo anterior</span></span></span>`;
}

/* en pantallas angostas la carretera abre donde empieza el primer camión, no a las 7:00 */
function indCrInicio(sc){

  const cam=sc.querySelector('.cr-cam'),marcas=[...sc.querySelectorAll('.cr-sal,.cr-par,.cr-pin,.cr-via')];if(!marcas.length)return;
  const base=sc.getBoundingClientRect().left-sc.scrollLeft,min=Math.min(...marcas.map(m=>m.getBoundingClientRect().left-base));
  sc.scrollLeft=Math.max(0,min-(cam?cam.offsetWidth:150)-24);

function indFiltros(cams,[a,b]){
  const placas=[...new Set(((IND.D&&IND.D.regs)||[]).map(r=>r.pl))].sort();
  const turnos=[...new Set(((IND.D&&IND.D.regs)||[]).map(r=>String(r.t)))].sort();

    ${IND.preset==='rango'?`<div class="ind-rango"><label><span>Desde</span><input type="date" id="indDesde" value="${a}" max="${hoyLima()}"></label><label><span>Hasta</span><input type="date" id="indHasta" value="${b}" max="${hoyLima()}"></label></div>`:''}

    <label class="ind-sel"><span class="sr">Camión</span><select id="indPla"><option value="">Camión: todos</option>${placas.map(p=>`<option value="${esc(p)}"${IND.placa===p?' selected':''}>${esc(p)}</option>`).join('')}</select></label>
    ${IND.turno!=='todos'||IND.placa?'<button type="button" class="ind-quitar" id="indQuitar">Quitar filtros</button>':''}
    <span class="ind-esp"></span>
    <span class="ind-estado">${IND.cargando?'<i class="gira"></i>Calculando…':IND.t?'Datos de las '+horaLima(IND.t):''}</span>
    <button type="button" class="ind-btn" id="indCsv"${cams&&cams.length?'':' disabled'} title="Descargar en CSV (se abre en Excel)">${IND_IC.bajar}<span>Descargar</span></button>
    <button type="button" class="ind-btn ind-act${IND.cargando?' girando':''}" id="indAct" title="Actualizar indicadores" aria-label="Actualizar indicadores">${IC.recargar}</button>
  </div>`;
}
function indContenido(){
  const [a,b]=indRango();
  const M=indModelo(IND.D);
  const cams=M?M.cams:null;
  let h=`<div class="ind-cab"><div><h2>Indicadores de distribución</h2><p>${esc(indRangoTxt(a,b))} · tiempos medidos con las marcas de Mi Ruta</p></div></div>`;
  h+=indFiltros(cams,[a,b]);
  if(IND.error&&!IND.D)return h+`<div class="ind-vacio"><b>No se pudieron calcular los indicadores</b><span>${esc(IND.error)}</span><button type="button" id="indReint">Reintentar</button></div>`;
  if(!IND.D)return h+`<div class="ind-vacio cargando"><i class="gira"></i><b>Calculando los tiempos del periodo…</b><span>Se leen las marcas de cada camión, día por día.</span></div>`;
  if(IND.error)h+=`<div class="aviso err">No se pudo actualizar (${esc(IND.error)}). Se muestra lo último que llegó.</div>`;
  const ok=IND.clave===a+'|'+b;
  if(!cams.length)return h+`<div class="ind-vacio"><b>No hay despachos en este periodo</b><span>Prueba con otro rango de fechas${IND.turno!=='todos'||IND.placa?' o quita los filtros':''}.</span></div>`;
  const m=indMedidas(cams);
  const kp=indAnterior(a,b).join('|'),P=IND.prev&&IND.clavePrev===kp?indMedidas(indModelo(IND.prev).cams):null;
  /* Orden de lectura: resumen del periodo → el día de cada camión → cada camión en el periodo →
     dónde se va el tiempo (clientes | recorridos, misma altura) → marcas que no entraron. */
  h+=`<div class="ind-cuerpo${IND.cargando||!ok?' viejo':''}">`;
  /* AUDITORÍA 3: el periodo anterior llega después; mientras tanto dice «Comparando…», no «Sin datos» */
  h+=indTiles(m,P,P?'ok':IND.prevFalla===kp?'error':'cargando');
  h+=indCarretera(cams);
  h+=indPorCamion(cams);
  h+=`<div class="ind-par">${indClientes(cams)}${indTramos(cams)}</div>`;
  h+=indRevisar(M.rev);
  h+=indComo();
  h+='</div>';
  return h;
}
/* --- resumen: una sola franja con 5 celdas idénticas (título · valor · P90 · comparación) --- */
const IND_SW={cli:'<i class="sw sw-cli" aria-hidden="true"></i>',reco:'<i class="sw sw-via" aria-hidden="true"></i>',
  alm:'<i class="sw sw-alm" aria-hidden="true"></i>',tot:'<i class="sw sw-tot" aria-hidden="true"></i>',conf:'<i class="sw sw-conf" aria-hidden="true"></i>'};
function indDeltaLinea(act,ant,menosMejor,prevEst){
  if(act==null)return '<span class="ind-delta nulo">&nbsp;</span>';
  if(prevEst==='cargando')return '<span class="ind-delta nulo">Comparando con el periodo anterior…</span>';
  if(prevEst==='error')return '<span class="ind-delta nulo">No se pudo traer el periodo anterior</span>';

}
function indTile(k,tit,st,sub,prevEst,Pst,vacio){

    <div class="ind-k-h">${IND_SW[k]}<span>${esc(tit)}</span></div>

    <div class="ind-k-s">${hay?`<span class="p90">P90</span><b>${indDur(st.p90)}</b><em>· ${plural(st.n,sub[0],sub[1])}</em>`:`<em>${esc(vacio)}</em>`}</div>
    ${indDeltaLinea(hay?st.med:null,Pst&&Pst.n?Pst.med:null,true,prevEst)}

}
function indTiles(m,P,prevEst){

    ${indTile('reco','Entre clientes',m.entre,['tramo','tramos'],Pv,P&&P.entre,'Aún no hay tramos entre dos clientes.')}

    ${indTile('tot','Ruta completa',m.total,['ruta','rutas'],Pv,P&&P.total,'Desde la salida hasta el último cliente.')}

/* --- la carretera horaria: el día de cada camión sobre un mismo reloj --- */
function indCarretera(cams){
  const dias=[...new Set(cams.map(c=>c.d))].sort();
  if(!IND.dia||!dias.includes(IND.dia)){const conMarcas=dias.filter(d=>cams.some(c=>c.d===d&&c.vis.length));IND.dia=conMarcas.length?conMarcas[conMarcas.length-1]:dias[dias.length-1];}
  const i=dias.indexOf(IND.dia),del=cams.filter(c=>c.d===IND.dia);
  const ts=[];del.forEach(c=>{if(c.sal)ts.push(indMs(c.sal));c.vis.forEach(s=>{if(s.ll)ts.push(indMs(s.ll));if(s.fi)ts.push(indMs(s.fi));});});
  const base=indMs(IND.dia+' 00:00:00');
  /* el reloj se ajusta a las horas del día (con un margen), así los bloques usan todo el ancho */
  let h0=8,h1=17;
  if(ts.length){h0=Math.floor((Math.min(...ts)-base)/3600000-.25);h1=Math.ceil((Math.max(...ts)-base)/3600000+.25);}
  h0=Math.max(0,h0);h1=Math.min(24,Math.max(h1,h0+6));
  const x=ms=>((ms-base)/3600000-h0)/(h1-h0)*100;
  const horas=[];for(let k=h0;k<=h1;k++)horas.push(k);
  const tick=horas.map(k=>`<span style="left:${((k-h0)/(h1-h0)*100).toFixed(3)}%">${String(k).padStart(2,'0')}:00</span>`).join('');
  const reja=horas.map(k=>`<i style="left:${((k-h0)/(h1-h0)*100).toFixed(3)}%"></i>`).join('');
  const filas=del.map(c=>{
    const v=c.vis;if(!v.length&&!c.sal)return '';
    const ini=c.sal?indMs(c.sal):v.length?indMs(v[0].ll||v[0].fi):null;
    const ult=v.length?indMs(v[v.length-1].fi||v[v.length-1].ll):ini;
    const via=ini!=null?`<div class="cr-via${c.sal?'':' sin-salida'}" style="left:${x(ini).toFixed(3)}%;width:${Math.max(.4,x(ult)-x(ini)).toFixed(3)}%"></div>`:'';
    const sal=c.sal?`<button type="button" class="cr-sal" style="left:${x(indMs(c.sal)).toFixed(3)}%" data-tt="${esc(JSON.stringify({t:'Salió del almacén',l:[['Hora',hm(c.sal)],['Marcó',tit(c.salPor||'')]]}))}" aria-label="Salió del almacén a las ${hm(c.sal)}"></button>`:'';
    const tramos=c.tramos.filter(t=>!t.flags.length&&t.min>0).map(t=>`<button type="button" class="cr-tramo" style="left:${x(indMs(t.a.fi)).toFixed(3)}%;width:${Math.max(.3,x(indMs(t.b.ll))-x(indMs(t.a.fi))).toFixed(3)}%" data-tt="${esc(JSON.stringify({t:'Recorrido',l:[['De',corto(t.a.cli)],['A',corto(t.b.cli)],['Tiempo',indDur(t.min)],['Distancia',t.km!=null?indKmTxt(t.km)+' en línea recta':'sin ubicación']]}))}" aria-label="Recorrido de ${esc(corto(t.a.cli))} a ${esc(corto(t.b.cli))}: ${indDur(t.min)}"></button>`).join('');
    const pars=v.map(s=>{
      const raro=s.flags.length>0,extra=raro?[['Por revisar',s.flags.map(f=>IND_REV[f]).join(', ')]]:[];
      if(s.ll&&s.fi){
        const l=x(indMs(s.ll)),w=Math.max(.35,x(indMs(s.fi))-l);
        return `<button type="button" class="cr-par ${cls(s.est)}${raro?' raro':''}" style="left:${l.toFixed(3)}%;width:${w.toFixed(3)}%" data-tt="${esc(JSON.stringify({t:s.pos+'. '+corto(s.cli),s:tit(s.di),l:[['Llegó',hm(s.ll)],['Terminó',hm(s.fi)],['En el cliente',indDur(s.min)],['Estado',TXT[s.est]],...extra]}))}" aria-label="Parada ${s.pos}, ${esc(corto(s.cli))}: ${indDur(s.min)} en el cliente"></button>`;
      }
      const t=s.ll||s.fi;
      return `<button type="button" class="cr-pin ${cls(s.est)}${raro?' raro':''}" style="left:${x(indMs(t)).toFixed(3)}%" data-tt="${esc(JSON.stringify({t:s.pos+'. '+corto(s.cli),s:tit(s.di),l:[[s.ll?'Llegó':'Terminó',hm(t)],['Estado',TXT[s.est]],['En el cliente','no se puede medir'],...extra]}))}" aria-label="Parada ${s.pos}, ${esc(corto(s.cli))}: sin tiempo medible"></button>`;
    }).join('');
    const enCli=v.filter(s=>s.min!=null&&!s.flags.length).reduce((a,s)=>a+s.min,0),reco=c.tramos.filter(t=>!t.flags.length&&t.min>0).reduce((a,t)=>a+t.min,0);
    return `<div class="cr-fila"><div class="cr-cam"><b>${esc(c.pl)}</b><small>${c.ru?'Ruta '+esc(c.ru)+' · ':''}${esc(tit(c.pe||''))}${del.some(o=>o.t!==c.t)?' · '+turnoTxt(c.t):''}</small></div>
      <div class="cr-pista">${reja}${via}${tramos}${sal}${pars}</div>
      <div class="cr-tot"><span>${indDur(enCli)}</span><span>${indDur(reco)}</span></div></div>`;
  }).join('');
  return `<section class="panel ind-panel cr">

/* v28: el chofer es fijo por camión y los ayudantes rotan. Del texto del equipo de cada día
   («Chofer + Ayudante + …», como lo arma el Planificador) se toma el chofer (el primero) y los ayudantes,
   y se cuentan los días de cada uno en el periodo. */
function indEquipo(cs){
  const norm=n=>String(n||'').replace(/\s+/g,' ').trim(),clave=n=>norm(n).toUpperCase();
  const ch=new Map(),ay=new Map(),dias=new Set();
  const suma=(m,n,d)=>{const k=/externo/i.test(n)?(m===ch?'CHOFER EXTERNO':'AUXILIAR EXTERNO'):clave(n);
    let o=m.get(k);if(!o){o={n:/externo/i.test(n)?(m===ch?'Chofer externo':'Auxiliar externo'):tit(norm(n)),d:new Set()};m.set(k,o);}o.d.add(d);};
  cs.forEach(c=>{
    const t=String(c.pe||'').split('+').map(norm).filter(Boolean);if(!t.length)return;dias.add(c.d);
    let i=0;if(!/auxiliar|ayudante/i.test(t[0])){suma(ch,t[0],c.d);i=1;}
    t.slice(i).forEach(n=>suma(ay,n,c.d));
  });
  const orden=m=>[...m.values()].map(o=>({n:o.n,d:o.d.size})).sort((a,b)=>b.d-a.d||a.n.localeCompare(b.n));
  return {ch:orden(ch),ay:orden(ay),dias:dias.size};
}
function indEquipoHtml(pl,cs){

  const l=[];
  e.ch.forEach((o,i)=>l.push([i?'Otro chofer':'Chofer',o.n+' · '+dd(o.d)]));

  const tt=JSON.stringify({t:pl,s:'Equipo en el periodo · '+dd(e.dias)+' con ruta',l});
  const MAX=4,vis=e.ay.slice(0,MAX),mas=e.ay.length-vis.length;

}
